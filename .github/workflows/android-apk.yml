name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, android-apk, new]
    paths:
      - "android/**"
      - "ui/**"
      - "*.py"
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - "requirements-android.txt"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "android/**"
      - "ui/**"
      - "*.py"
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"

# Do not let an older main build publish after a newer main build starts.
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      # Python 3.12 serves two jobs: the test run, and Chaquopy's build-time Python (must match android version "3.12").
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-android.txt

      - name: Python tests (offline, providers are faked)
        run: |
          python -m pip install -r requirements-android.txt pytest fastapi==0.162.0
          python -m pytest tests -q

      - name: Frontend syntax check
        run: for f in ui/src/js/*.js; do node --check "$f"; done

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: "11.25.0"

      - name: WebView UI regression tests (fake providers, no phone required)
        run: |
          pnpm --dir ui install --frozen-lockfile
          pnpm --dir ui test

      - name: Build frontend (single page into ui/dist)
        run: python ui/build.py

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0"

      # apksigner and aapt2 live in build-tools, which setup-android does not put on PATH.
      - name: Put Android build-tools on PATH (apksigner, aapt2)
        run: |
          BT="$ANDROID_HOME/build-tools/34.0.0"
          test -x "$BT/apksigner" && test -x "$BT/aapt2"
          echo "$BT" >> "$GITHUB_PATH"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.9"

      # The engine .py files and ui/dist/adarsh.html are copied into the app by the syncEngine / syncUi Gradle tasks.
      - name: Build release APK (unsigned, not debuggable)
        run: gradle -p android assembleRelease --stacktrace

      - name: Sign APK with the release key (secrets are mandatory)
        if: github.event_name != 'pull_request'
        env:
          ADARSH_RELEASE_KEYSTORE_B64: ${{ secrets.ADARSH_RELEASE_KEYSTORE_B64 }}
          ADARSH_RELEASE_STORE_PASSWORD: ${{ secrets.ADARSH_RELEASE_STORE_PASSWORD }}
          ADARSH_RELEASE_KEY_ALIAS: ${{ secrets.ADARSH_RELEASE_KEY_ALIAS }}
          ADARSH_RELEASE_KEY_PASSWORD: ${{ secrets.ADARSH_RELEASE_KEY_PASSWORD }}
          EXPECTED_CERT_SHA256: 600b196ec2224730ea8d24e83e9f9411bd661329569598e07180cd6b596ea5af
        run: |
          set -euo pipefail
          # The legacy key (adarsh-debug.keystore) was public. It is retired: never used to sign, never trusted.
          for v in ADARSH_RELEASE_KEYSTORE_B64 ADARSH_RELEASE_STORE_PASSWORD ADARSH_RELEASE_KEY_ALIAS ADARSH_RELEASE_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::Signing secret $v is missing. Refusing to build an unsigned or legacy-signed APK."
              exit 1
            fi
          done
          UNSIGNED=$(ls android/app/build/outputs/apk/release/*.apk | head -n1)
          SIGNED="$RUNNER_TEMP/adarsh-signed.apk"
          KS="$RUNNER_TEMP/adarsh-release.jks"
          trap 'rm -f "$KS"' EXIT
          printf '%s' "$ADARSH_RELEASE_KEYSTORE_B64" | base64 --decode > "$KS"
          chmod 600 "$KS"
          # v3 only: the lineage (old -> new certificate) lets phones that still carry the old
          # certificate upgrade, while the old private key is no longer needed anywhere.
          # minSdk is 28, the first Android version that understands v3 signing.
          apksigner sign \
            --in "$UNSIGNED" --out "$SIGNED" \
            --min-sdk-version 28 --rotation-min-sdk-version 28 \
            --v1-signing-enabled false --v2-signing-enabled false --v3-signing-enabled true \
            --lineage android/app/signing/adarsh-release-lineage.bin \
            --ks "$KS" --ks-key-alias "$ADARSH_RELEASE_KEY_ALIAS" \
            --ks-pass env:ADARSH_RELEASE_STORE_PASSWORD --key-pass env:ADARSH_RELEASE_KEY_PASSWORD
          rm -f "$UNSIGNED"
          mv "$SIGNED" "android/app/build/outputs/apk/release/adarsh-ensemble-signed.apk"
          APK=android/app/build/outputs/apk/release/adarsh-ensemble-signed.apk
          VERIFY_OUTPUT=$(apksigner verify -v --print-certs "$APK" 2>&1)
          printf '%s\n' "$VERIFY_OUTPUT" | grep -v -i 'warning' || true
          printf '%s\n' "$VERIFY_OUTPUT" | grep -Fq 'Verified using v3 scheme (APK Signature Scheme v3): true'
          CURRENT_CERT=$(printf '%s\n' "$VERIFY_OUTPUT" | sed -n 's/.*certificate SHA-256 digest: //p' | head -n1 | tr -d ':' | tr '[:upper:]' '[:lower:]')
          if [ "$CURRENT_CERT" != "$EXPECTED_CERT_SHA256" ]; then
            echo "Expected release certificate $EXPECTED_CERT_SHA256 but got $CURRENT_CERT" >&2
            exit 1
          fi
      - name: Safety checks on the APK (not debuggable, minSdk 28)
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -n1)
          BADGING=$(aapt2 dump badging "$APK")
          if printf '%s\n' "$BADGING" | grep -q 'application-debuggable'; then
            echo "::error::The APK is debuggable. Release builds must not be debuggable." >&2
            exit 1
          fi
          printf '%s\n' "$BADGING" | grep -q "^sdkVersion:'28'"
      - name: Check the APK contains the engine and the page
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -n1)
          unzip -l "$APK" | grep -q "assets/index.html"
          unzip -l "$APK" | grep -q "assets/chaquopy"
          ls -lh "$APK"

      # Only signed builds are uploaded (pull requests from forks have no signing secrets).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name != 'pull_request'
        with:
          name: adarsh-ensemble-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Prepare verified release assets
        if: github.event_name != 'pull_request'
        env:
          RELEASE_TAG: v1.0.${{ github.run_number }}
          RELEASE_ASSET: adarsh-ensemble-1.0.${{ github.run_number }}.apk
        run: |
          set -euo pipefail
          mkdir -p release-assets
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -n1)
          cp "$APK" "release-assets/$RELEASE_ASSET"
          CERT_SHA256=$(apksigner verify --print-certs -v "release-assets/$RELEASE_ASSET" 2>&1 | sed -n 's/.*certificate SHA-256 digest: //p' | head -n1 | tr -d ':' | tr '[:upper:]' '[:lower:]')
          if [ -z "$CERT_SHA256" ]; then
            echo "Could not read the APK signing certificate with apksigner" >&2
            exit 1
          fi
          echo "APK signing certificate SHA-256: $CERT_SHA256"
          python scripts/publish_android_release.py manifest \
            --apk "release-assets/$RELEASE_ASSET" \
            --application-id app.adarsh.ensemble \
            --version-code "$GITHUB_RUN_NUMBER" \
            --version-name "1.0.$GITHUB_RUN_NUMBER" \
            --commit "$GITHUB_SHA" \
            --tag "$RELEASE_TAG" \
            --asset-name "$RELEASE_ASSET" \
            --certificate-sha256 "$CERT_SHA256" \
            --output release-assets/update.json
          printf '%s\n' "$GITHUB_SHA" > release-assets/built-sha.txt
          RELEASE_ASSET="$RELEASE_ASSET" RELEASE_TAG="$RELEASE_TAG" BUILT_SHA="$GITHUB_SHA" RUN_NUMBER="$GITHUB_RUN_NUMBER" python - <<'PY'
          import json
          import os
          from pathlib import Path
          from scripts.publish_android_release import verify_release_fixture
          manifest = json.loads(Path("release-assets/update.json").read_text())
          verify_release_fixture(
              Path("release-assets") / os.environ["RELEASE_ASSET"],
              manifest,
              expected_commit=os.environ["BUILT_SHA"],
              expected_version_code=int(os.environ["RUN_NUMBER"]),
              tag=os.environ["RELEASE_TAG"],
              verify_apk_identity=True,
              aapt2_path="aapt2",
              apksigner_path="apksigner",
          )
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name != 'pull_request'
        with:
          name: android-release-assets
          path: release-assets/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    concurrency:
      group: android-release-publish
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-release-assets
          path: release-assets

      - name: Gate and publish the matching current-main release idempotently
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v1.0.${{ github.run_number }}
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          BUILT_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          MAIN_SHA=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          DECISION=$(python scripts/publish_android_release.py gate \
            --event "$EVENT_NAME" \
            --ref "$GIT_REF" \
            --built-sha "$BUILT_SHA" \
            --head-sha "$MAIN_SHA")
          if [ "$DECISION" != publish ]; then
            echo "Skipping obsolete or non-main build (built=$BUILT_SHA main=$MAIN_SHA)."
            exit 0
          fi
          APK=$(find release-assets -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$APK"
          test -f release-assets/update.json

          # A published latest release supplies the monotonic version gate. Drafts are not
          # latest and are handled separately by the immutable same-tag decision below.
          LATEST_RELEASE_JSON="$RUNNER_TEMP/latest-release.json"
          LATEST_UPDATE_JSON="$RUNNER_TEMP/latest-update.json"
          LATEST_VERSION_CODE=0
          LATEST_ERROR="$RUNNER_TEMP/latest-release.err"
          if gh api "repos/utkarshadarsh2992-blip/adarsh-ensemble/releases/latest" > "$LATEST_RELEASE_JSON" 2>"$LATEST_ERROR"; then
            LATEST_UPDATE_ID=$(python - "$LATEST_RELEASE_JSON" <<'PY'
          import json
          import sys
          release = json.load(open(sys.argv[1], encoding="utf-8"))
          matches = [a["id"] for a in release.get("assets", []) if a.get("name") == "update.json"]
          if len(matches) != 1:
              raise SystemExit("latest release does not have exactly one update.json asset")
          print(matches[0])
          PY
            )
            gh api -H "Accept: application/octet-stream" \
              "repos/utkarshadarsh2992-blip/adarsh-ensemble/releases/assets/$LATEST_UPDATE_ID" > "$LATEST_UPDATE_JSON"
            LATEST_VERSION_CODE=$(python scripts/publish_android_release.py manifest-version --manifest "$LATEST_UPDATE_JSON")
          elif ! grep -q 'HTTP 404' "$LATEST_ERROR"; then
            echo "Cannot verify latest published version; refusing publication."
            cat "$LATEST_ERROR"
            exit 1
          fi

          EXISTING_RELEASE_JSON="$RUNNER_TEMP/existing-release.json"
          EXISTING_ARG=()
          if gh api "repos/utkarshadarsh2992-blip/adarsh-ensemble/releases/tags/$RELEASE_TAG" > "$EXISTING_RELEASE_JSON" 2>/dev/null; then
            EXISTING_ARG=(--existing-release "$EXISTING_RELEASE_JSON")
          else
            rm -f "$EXISTING_RELEASE_JSON"
          fi
          PUBLISH_DECISION=$(python scripts/publish_android_release.py decide \
            --tag "$RELEASE_TAG" \
            --expected-commit "$BUILT_SHA" \
            --expected-version-code "$RUN_NUMBER" \
            --run-number "$RUN_NUMBER" \
            --latest-version-code "$LATEST_VERSION_CODE" \
            --apk "$APK" \
            --manifest release-assets/update.json \
            "${EXISTING_ARG[@]}")

          if [ "$PUBLISH_DECISION" = skip ]; then
            echo "Release $RELEASE_TAG is already verified and published, or this run is older than latest."
            exit 0
          fi

          if [ "$PUBLISH_DECISION" = create ]; then
            gh release create "$RELEASE_TAG" "$APK" release-assets/update.json \
              --draft \
              --target "$BUILT_SHA" \
              --title "Adarsh Ensemble $RELEASE_TAG" \
              --notes "Automated Android release for commit $BUILT_SHA."
          elif [ "$PUBLISH_DECISION" = retry_draft ]; then
            # The helper has already rejected any existing digest mismatch. Upload only absent
            # assets so a failed draft can be resumed without replacing immutable bytes.
            for ASSET in "$APK" release-assets/update.json; do
              NAME=$(basename "$ASSET")
              if ! python - "$EXISTING_RELEASE_JSON" "$NAME" <<'PY'
          import json
          import sys
          release = json.load(open(sys.argv[1], encoding="utf-8"))
          raise SystemExit(0 if any(a.get("name") == sys.argv[2] for a in release.get("assets", [])) else 1)
          PY
              then
                gh release upload "$RELEASE_TAG" "$ASSET"
              fi
            done
          fi

          # Re-check immediately before advertising the release. If main advanced, leave the
          # release as a draft; a newer successful run must become latest instead.
          MAIN_SHA=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          FINAL_GATE=$(python scripts/publish_android_release.py gate \
            --event "$EVENT_NAME" \
            --ref "$GIT_REF" \
            --built-sha "$BUILT_SHA" \
            --head-sha "$MAIN_SHA")
          if [ "$FINAL_GATE" != publish ]; then
            echo "Main advanced before undrafting; leaving $RELEASE_TAG as draft."
            exit 0
          fi
          gh release edit "$RELEASE_TAG" --draft=false --latest=true
