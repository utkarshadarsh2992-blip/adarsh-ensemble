<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Audit M1/L7: no frames, plugins or <base> rewrites can ever load inside the app (the native bridge is visible to every frame). -->
<!-- Native pages load bundled scripts/styles; browser mode uses only user-configured HTTPS endpoints. Inline style is retained for dynamic layout values. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'self' https:; font-src 'self' https://fonts.gstatic.com data:; base-uri 'none'; form-action 'none'; frame-src 'none'; object-src 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="edge">
<meta name="theme-color" content="#FAF8F4">
<title>ADARSH</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=JetBrains+Mono:wght@400;500&display=swap">

<link rel="stylesheet" href="css/mission.css">

<link rel="stylesheet" href="css/news.css">
</head>
<body>
<!-- Startup animation (css/boot.css, js/07-splash.js). First paint, so the chat never flashes before it. -->
<div class="boot" id="boot" aria-hidden="true">
  <div class="boot-floor"><i></i></div>
  <div class="boot-scan"></div>
  <span class="boot-c tl"></span><span class="boot-c tr"></span><span class="boot-c bl"></span><span class="boot-c br"></span>
  <div class="boot-tag l">ADARSH // CORE</div><div class="boot-tag r" id="boot-clock">--:--:--</div>
  <div class="boot-glow"></div>
  <div class="boot-ring"><svg class="boot-hud" viewBox="0 0 200 200">
    <circle class="h0" cx="100" cy="100" r="97"/><circle class="h1" cx="100" cy="100" r="90"/>
    <circle class="h2" cx="100" cy="100" r="80"/><circle class="h3" cx="100" cy="100" r="68"/><circle class="h4" cx="100" cy="100" r="68"/>
  </svg></div>
  <svg class="boot-logo" viewBox="0 0 108 108"><path class="fill" fill-rule="evenodd" d="M54,28 L74,80 L65,80 L61,69 L47,69 L43,80 L34,80 Z M54,44 L49.5,60 L58.5,60 Z"/><path class="edge" pathLength="100" d="M54,28 L74,80 L65,80 L61,69 L47,69 L43,80 L34,80 Z M54,44 L49.5,60 L58.5,60 Z"/></svg>
  <div class="boot-info">
    <div class="boot-name" id="boot-name">ADARSH</div>
    <div class="boot-sub">AI ENSEMBLE · NEURAL CORE</div>
    <div class="boot-log" id="boot-log"></div>
    <div class="boot-bar"><i id="boot-fill"></i></div>
    <div class="boot-foot"><span id="boot-state">BOOTING</span><b id="boot-pct">0%</b></div>
  </div>
  <div class="boot-skip">TAP TO SKIP</div>
</div>
<div class="phone" id="phone">
  <section class="view on" id="v-chat"></section>
  <section class="view" id="v-today"></section>
  <section class="view" id="v-goals"></section>
  <section class="view" id="v-usage"></section>
  <section class="view" id="v-news"></section>
  <section class="view" id="v-tasks"></section>
  <section class="view" id="v-work"></section>
  <section class="view" id="v-alarms"></section>
  <section class="view" id="v-notes"></section>
  <section class="view" id="v-library"></section>
  <section class="view" id="v-philosophy"></section>
  <section class="view" id="v-settings"></section>
  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer" aria-label="Menu"></aside>
  <div class="voice" id="voice" data-state="idle" hidden></div>
  <div class="banners" id="banners"></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="lock" id="lock" hidden></div>
</div>
<input type="file" id="f-any" multiple hidden>
<input type="file" id="f-img" accept="image/*" hidden>
<input type="file" id="f-camera" accept="image/*" capture="environment" hidden>
<input type="file" id="f-import" accept="application/json" hidden>
<script src="js/00-android-bridge.js"></script>
<script src="js/01-core.js"></script>
<script src="js/01-math.js"></script>
<script src="js/01-motion.js"></script>

<script src="js/03-council.js"></script>
<script src="js/03-lessons.js"></script>
<script src="js/03-learn.js"></script>
<script src="js/03-modes.js"></script>
<script src="js/03-chat.js"></script>
<script src="js/04-productivity.js"></script>
<script src="js/04-productivity-views.js"></script>
<script src="js/04-mission.js"></script>
<script src="js/04-briefing.js"></script>
<script src="js/04-usage.js"></script>
<script src="js/04-news.js"></script>
<script src="js/04-views.js"></script>
<script src="js/05-voice.js"></script>
<script src="js/05-actions.js"></script>
<script src="js/06-lock.js"></script>
<script src="js/07-backend.js"></script>
<script src="js/05-mobile.js"></script>
<script src="js/07-splash.js"></script>
<script src="js/08-boot.js"></script>
</body>
</html>
