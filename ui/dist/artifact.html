<title>ADARSH</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* =====================================================================================
   ADARSH UI : app.css   (design system v4)
   Layout: one phone-width app (max 480px, centred on wide screens). Side drawer for navigation.
   Warm paper ground, soft cards, one clay-orange accent (identity), one blue (selection).
   Replies are set in a serif for reading; controls, labels and chat bubbles in the sans.
   Scale: radius 10 / 14 / 20 / 26. Spacing in steps of 4. Shadows are --sh1 (resting) and --sh2 (floating).
   ===================================================================================== */
:root{
  --outer:#E9E6E0; --bg:#FAF9F6; --paper:#FFFFFF; --card:#F1EFE8; --card2:#E8E5DC; --code:#F5F3EC;
  --fg:#1D1C1A; --fg2:#45423C; --muted:#78746B; --line:#E4E0D6; --line2:#D3CEC2;
  --accent:#D0623A; --accent-fg:#FFFFFF; --sel:#2F6FD8; --user:#EDEAE1;
  --good:#2C7A4B; --warn:#A8690F; --bad:#B03A2A; --info:#32679A;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --serif:'Newsreader','Iowan Old Style',Georgia,serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --body:var(--sans); --reply:var(--serif);
  --r-s:10px; --r-m:14px; --r-l:20px; --r-xl:26px;
  --sh1:0 1px 2px rgba(60,45,25,.06),0 3px 10px rgba(60,45,25,.05);
  --sh2:0 10px 34px rgba(60,45,25,.16),0 2px 8px rgba(60,45,25,.07);
  --shadow:0 4px 22px rgba(0,0,0,.18);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --outer:#0A0A0A; --bg:#111111; --paper:#1A1A1A; --card:#1E1E1E; --card2:#2A2A2A; --code:#171717;
    --fg:#EDEDED; --fg2:#C9C7C1; --muted:#8F8F8F; --line:#2C2C2C; --line2:#3A3A3A;
    --accent:#DA7551; --accent-fg:#1B1410; --sel:#4C8DF0; --user:#2A2A2A;
    --good:#58B67F; --warn:#D9A24A; --bad:#E5705E; --info:#6FA6D8; color-scheme:dark;
    --sh1:0 1px 2px rgba(0,0,0,.45); --sh2:0 12px 36px rgba(0,0,0,.6),0 2px 8px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --outer:#0A0A0A; --bg:#111111; --paper:#1A1A1A; --card:#1E1E1E; --card2:#2A2A2A; --code:#171717;
  --fg:#EDEDED; --fg2:#C9C7C1; --muted:#8F8F8F; --line:#2C2C2C; --line2:#3A3A3A;
  --accent:#DA7551; --accent-fg:#1B1410; --sel:#4C8DF0; --user:#2A2A2A;
  --good:#58B67F; --warn:#D9A24A; --bad:#E5705E; --info:#6FA6D8; color-scheme:dark;
  --sh1:0 1px 2px rgba(0,0,0,.45); --sh2:0 12px 36px rgba(0,0,0,.6),0 2px 8px rgba(0,0,0,.4);
}
:root[data-font="sans"]{--reply:var(--sans)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--outer);color:var(--fg);font:16px/1.55 var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:disabled{cursor:default}
textarea,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sel);outline-offset:2px;border-radius:8px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.s{width:18px;height:18px}
svg.i.chev{width:16px;height:16px;color:var(--muted);transition:transform .15s}
details[open]>summary svg.i.chev{transform:rotate(90deg)}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted);font-size:13.5px}
.center{text-align:center}
.mono{font-family:var(--mono)}

.phone{height:100%;max-width:480px;margin:0 auto;position:relative;overflow:hidden;background:var(--bg)}
@media (min-width:520px){.phone{border-inline:1px solid var(--line)}}
.view{position:absolute;inset:0;display:none;flex-direction:column;min-height:0}
.view.on{display:flex}
.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.stack{display:flex;flex-direction:column;gap:16px;padding-top:6px;padding-bottom:40px}

/* ---------- header ---------- */
.hdr{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;min-height:56px;padding-top:4px;padding-bottom:4px;border-bottom:1px solid transparent;transition:border-color .15s}
.hdr.scrolled{border-bottom-color:var(--line)}
.hdr h1{width:100%;max-width:100%;margin:0;text-align:center;font:600 16px/1.25 var(--sans);letter-spacing:-.005em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;padding:0 6px}
.hdr h1.wm{font:500 21px/1.1 var(--serif);letter-spacing:.05em}
.ttl{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;width:100%;text-align:center}
.ib{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;color:var(--fg)}
.ib:active{background:var(--card)}
.tag{font:500 10.5px/1 var(--mono);letter-spacing:.06em;padding:4px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.demo{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent);background:color-mix(in srgb,var(--warn) 10%,transparent)}
.status{display:inline-flex;gap:6px;align-items:center;font:500 11px/1 var(--mono);color:var(--muted);letter-spacing:.03em}
.status i{width:6px;height:6px;border-radius:50%;background:var(--good)}
.status.demo i{background:var(--warn)}

/* ---------- buttons / chips ---------- */
.btn{height:44px;padding:0 22px;border-radius:22px;font-weight:500;background:var(--fg);color:var(--bg);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.pri{background:var(--accent);color:var(--accent-fg)}
.btn.ghost{background:var(--card2);color:var(--fg)}
.btn.danger{background:var(--bad);color:#fff}
.btn:disabled{opacity:.35}
.link{color:var(--muted);font-size:14px;padding:8px 10px;border-radius:10px}
.link:active{background:var(--card2)}
.chip{font:500 11px var(--mono);padding:3px 7px;border-radius:7px;background:var(--card2);color:var(--muted)}
.chip.ok{color:var(--good)}.chip.no{color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:5px;font:500 10.5px/1 var(--mono);letter-spacing:.04em;padding:5px 8px;border-radius:999px;white-space:nowrap;flex:none}
.pill.good{color:var(--good);background:color-mix(in srgb,var(--good) 15%,transparent)}
.pill.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 15%,transparent)}
.pill.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,transparent)}
.pill.info{color:var(--info);background:color-mix(in srgb,var(--info) 15%,transparent)}
.pill.mute{color:var(--muted);background:var(--card2)}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;gap:2px;border:1px solid transparent}
.seg button{flex:1;padding:9px 6px;border-radius:9px;text-align:center;font-size:13.5px;letter-spacing:-.005em;color:var(--muted);transition:background .18s ease,color .18s ease,box-shadow .18s ease}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.sw{width:48px;height:28px;border-radius:14px;background:var(--card2);position:relative;flex:none;display:block;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--fg) 7%,transparent);transition:background .22s cubic-bezier(.22,1,.36,1)}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .26s cubic-bezier(.22,1,.36,1)}
[aria-checked="true"]>.sw{background:var(--accent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 60%,transparent)}
[aria-checked="true"]>.sw::after{transform:translateX(20px)}
input[type=range]{width:100%;accent-color:var(--accent)}

/* ---------- chat ---------- */
.thread{scroll-behavior:smooth;display:flex;flex-direction:column}
.col{display:flex;flex-direction:column;gap:26px;padding:14px 0 36px;width:100%}
.col.empty{flex:1;justify-content:center;gap:0;padding:0 0 4vh;color:var(--fg)}

/* empty state: greeting, mode tag, starter prompts */
.hello{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.mark{width:46px;height:46px;border-radius:14px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font:500 24px/1 var(--serif);margin-bottom:8px;box-shadow:var(--sh1)}
.mark.sm{width:30px;height:30px;border-radius:9px;font-size:16px}
.hello h2{margin:0;font:400 clamp(27px,7.6vw,34px)/1.15 var(--serif);letter-spacing:-.015em}
.hello p{margin:0;color:var(--muted);font-size:15px;line-height:1.45;max-width:32ch}
.modetag{display:inline-flex;align-items:center;gap:7px;margin-top:2px;padding:5px 12px 5px 10px;border-radius:999px;font:500 12.5px/1.2 var(--sans);color:var(--accent);background:color-mix(in srgb,var(--accent) 11%,transparent)}
.starters{display:flex;flex-direction:column;gap:8px;width:100%;margin-top:22px}
.starter{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border:1px solid var(--line);background:var(--paper);border-radius:var(--r-m);font:400 14.5px/1.35 var(--sans);color:var(--fg2);text-align:left;box-shadow:var(--sh1)}
.starter svg{color:var(--accent)}
.starter:active{background:var(--card)}

/* messages */
.msg{display:flex;flex-direction:column;gap:10px;min-width:0}
.msg.user{align-items:flex-end}
.bubble{background:var(--user);padding:10px 15px;border-radius:var(--r-l);max-width:88%;white-space:pre-wrap;overflow-wrap:anywhere;font:400 15.5px/1.5 var(--sans)}
.bubble .thumbs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.bubble .thumbs img{width:96px;height:96px;object-fit:cover;border-radius:12px}
.bubble .fchip{display:inline-flex;align-items:center;gap:6px;font:500 12px var(--mono);color:var(--muted);background:var(--card2);padding:5px 9px;border-radius:9px}
.ans{background:var(--user);border-radius:var(--r-l);max-width:92%;padding:10px 15px;font-size:14.5px}
.ans .k{font:500 10.5px var(--mono);letter-spacing:.09em;color:var(--muted);text-transform:uppercase;display:block;margin-bottom:4px}
.ans div+div{margin-top:4px}.ans b{font-weight:500;color:var(--muted)}
.decision{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;font-size:14px;background:var(--user)}
.decision.allow{color:var(--good)}.decision.deny{color:var(--bad)}

/* reply text: serif, open page, no bubble */
.prose{overflow-wrap:anywhere}
.msg>.prose{font-family:var(--reply);font-size:17px;line-height:1.65;color:var(--fg)}
.prose p{margin:0 0 .9em}.prose p:last-child{margin-bottom:0}
.prose ul,.prose ol{margin:0 0 .9em;padding-left:1.35em}.prose li{margin:.3em 0}.prose li::marker{color:var(--muted)}
.prose strong{font-weight:600}
.prose h3{margin:1.15em 0 .35em;font:500 21px/1.3 var(--reply)}
.prose h4{margin:1em 0 .3em;font:500 18px/1.35 var(--reply)}
.prose h3:first-child,.prose h4:first-child{margin-top:0}
.prose hr{border:0;border-top:1px solid var(--line);margin:1.2em 0}
.prose blockquote{margin:0 0 .9em;padding:.1em 0 .1em 14px;border-left:3px solid var(--line2);color:var(--fg2)}
.prose blockquote>:last-child{margin-bottom:0}
.prose code{font:500 .84em var(--mono);background:var(--card);padding:.14em .4em;border-radius:6px}
.prose a{text-underline-offset:2px}

/* code block: language label + copy */
.codeblock{margin:.3em 0 1em;background:var(--code);border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden;font-family:var(--sans)}
.cb-head{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 4px 14px;border-bottom:1px solid var(--line);color:var(--muted)}
.cb-lang{font:500 11.5px var(--mono);letter-spacing:.04em;text-transform:lowercase}
.cb-copy{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:8px;font:500 12px var(--sans);color:var(--muted)}
.cb-copy:hover,.cb-copy:active{background:var(--card2);color:var(--fg)}
.prose .codeblock pre{margin:0;padding:12px 14px;font:400 13px/1.6 var(--mono);background:none;border-radius:0;overflow-x:auto;-webkit-overflow-scrolling:touch}
.prose .codeblock code{background:none;padding:0;font:400 13px/1.6 var(--mono);color:var(--fg)}

/* tables */
.mdtable{margin:.3em 0 1em;border:1px solid var(--line);border-radius:var(--r-m);overflow-x:auto;font-family:var(--sans);background:var(--paper)}
table.md{border-collapse:collapse;width:100%;font-size:14px;line-height:1.45}
table.md th{background:var(--card);font-weight:600;font-size:12.5px;text-align:left;white-space:nowrap}
table.md th,table.md td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:top}
table.md thead th{border-top:0}
table.md td:first-child{font-weight:500}

/* maths (01-math.js) */
:is(.math,.mathblock){font-family:var(--reply);line-height:1.2}
.math{font-size:1.04em;white-space:nowrap}
.mathblock{display:block;text-align:center;margin:.45em 0 1em;font-size:1.2em;overflow-x:auto;padding:6px 2px;line-height:1.55}
:is(.math,.mathblock) i{font-style:italic}
:is(.math,.mathblock) .rm{font-style:normal}
:is(.math,.mathblock) .fn{margin-right:.14em}
:is(.math,.mathblock) .op{margin:0 .22em}
:is(.math,.mathblock) .op:first-child{margin:0}
:is(.math,.mathblock) :is(sup,sub) .op{margin:0 .08em}
:is(.math,.mathblock) .big{font-size:1.4em;line-height:.8;vertical-align:-.1em;margin:0 .06em}
:is(.math,.mathblock) sup,:is(.math,.mathblock) sub{font-size:.72em;line-height:0}
:is(.math,.mathblock) .ss{display:inline-block;vertical-align:-.6em;font-size:.72em;line-height:1;text-align:left}
:is(.math,.mathblock) .ss sup,:is(.math,.mathblock) .ss sub{display:block;font-size:1em;line-height:1.15;vertical-align:baseline;position:static}
:is(.math,.mathblock) .frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .15em;font-size:.95em;line-height:1.25}
:is(.math,.mathblock) .frac .n{padding:0 .25em .06em;border-bottom:1px solid currentColor}
:is(.math,.mathblock) .frac .d{padding:.06em .25em 0}
:is(.math,.mathblock) .sqrt{white-space:nowrap}
:is(.math,.mathblock) .sqrt .rad{display:inline-block;border-top:1px solid currentColor;padding:0 .12em;line-height:1.1;margin-left:-.04em}
:is(.math,.mathblock) .sqrt .ri{font-size:.55em;margin-right:-.2em;vertical-align:.7em}
:is(.math,.mathblock) .ov{border-top:1px solid currentColor}

/* reply action row */
.actions{display:flex;flex-wrap:wrap;gap:2px;align-items:center;color:var(--muted);min-height:34px;margin-left:-8px}
.actions button{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:34px;height:34px;padding:0 8px;border-radius:var(--r-s);font:400 13px var(--sans)}
.actions button:hover,.actions button:active{background:var(--card);color:var(--fg)}
.actions button[aria-pressed="true"]{color:var(--accent)}
.actions .meta{margin-left:auto;display:inline-flex;align-items:center;gap:6px;padding:0 8px 0 6px;height:26px;border-radius:999px;font:500 11.5px var(--sans);color:var(--muted);background:var(--card)}
.think{display:flex;align-items:center;gap:10px;color:var(--muted);font:400 14.5px var(--sans)}
.dots{display:inline-flex;gap:4px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:pulse 1.2s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes pulse{0%,80%,100%{opacity:.25;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
.steps{background:var(--card);border-radius:var(--r-m);font-family:var(--sans)}
.steps>summary{display:flex;gap:8px;align-items:center;padding:10px 14px;font-size:13px;color:var(--muted);cursor:pointer;list-style:none}
.steps>summary::-webkit-details-marker{display:none}
.steps .st-row{padding:2px 14px 2px 38px;font-size:13px;color:var(--muted)}
.steps .st-row:last-child{padding-bottom:10px}

/* composer */
.dock{position:relative;padding-top:6px;padding-bottom:max(10px,env(safe-area-inset-bottom,0px))}
.box{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-xl);padding:12px 10px 8px 16px;box-shadow:var(--sh1);transition:border-color .15s,box-shadow .15s}
.box:focus-within{border-color:color-mix(in srgb,var(--accent) 42%,var(--line));box-shadow:var(--sh2)}
.box textarea{width:100%;resize:none;border:0;outline:0;background:transparent;font-size:16px;line-height:1.5;max-height:180px;min-height:28px;padding:2px 0;display:block}
.box textarea::placeholder{color:var(--muted)}
.box .row{display:flex;align-items:center;gap:2px;margin-top:6px;margin-left:-6px}
.box .row .sp{flex:1}
.circ{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none}
.circ.plus{color:var(--fg2)}.circ.plus:active{background:var(--card2)}
.circ.mic{color:var(--fg2)}.circ.mic:active{background:var(--card2)}
.circ.mic.live{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.circ.send{background:var(--accent);color:var(--accent-fg)}
.circ.voicebtn{background:var(--fg);color:var(--bg)}
.fine{text-align:center;color:var(--muted);font:400 11.5px var(--sans);margin:8px 0 0}
.atts{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 8px -4px}
.atts:empty{display:none}
.att{position:relative;display:flex;align-items:center;gap:8px;background:var(--card2);border-radius:var(--r-m);padding:5px 32px 5px 5px;max-width:100%}
.att img,.att .ic{width:40px;height:40px;border-radius:var(--r-s);object-fit:cover;flex:none}
.att .ic{background:var(--card);display:grid;place-items:center;color:var(--muted)}
.att span{font-size:13px;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att button{position:absolute;right:3px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}

/* mode button (in the composer) and its menu */
.modebtn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 8px 0 10px;border-radius:17px;color:var(--muted);font:500 13.5px var(--sans);max-width:44vw;margin-right:2px}
.modebtn .mn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.modebtn svg:last-child{width:14px;height:14px;opacity:.7;margin-left:-1px}
.modebtn:hover,.modebtn:active,.modebtn[aria-expanded="true"]{background:var(--card2);color:var(--fg)}
.modebtn.on{color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.modebtn.on[aria-expanded="true"],.modebtn.on:active{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
.pop-scrim{position:absolute;inset:0;z-index:32}
.pop{position:absolute;right:12px;width:min(340px,calc(100% - 24px));max-height:72%;overflow-y:auto;background:var(--paper);border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--sh2);padding:6px;transform-origin:bottom right;animation:popin .14s ease-out}
.pop-h{font:500 10.5px var(--mono);letter-spacing:.09em;color:var(--muted);text-transform:uppercase;padding:8px 10px 4px}
.pop-item{display:flex;align-items:center;gap:12px;width:100%;padding:9px 10px;border-radius:var(--r-m)}
.pop-item:hover,.pop-item:focus-visible{background:var(--card)}
.pop-item .pi-ic{width:34px;height:34px;border-radius:var(--r-s);background:var(--card);display:grid;place-items:center;color:var(--fg2);flex:none}
.pop-item[aria-checked="true"] .pi-ic{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.pop-item .pi-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.pop-item b{font:500 15px/1.25 var(--sans)}
.pop-item small{color:var(--muted);font:400 13px/1.35 var(--sans)}
.pop-item .pi-ck{width:20px;color:var(--accent);flex:none;display:grid;place-items:center}
@keyframes popin{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}

/* scroll to latest */
.jump{position:absolute;right:18px;bottom:calc(100% + 8px);width:38px;height:38px;border-radius:50%;background:var(--paper);border:1px solid var(--line);box-shadow:var(--sh2);display:grid;place-items:center;color:var(--fg2);opacity:0;visibility:hidden;transform:translateY(6px);transition:opacity .18s,transform .18s,visibility .18s;z-index:2}
.jump.show{opacity:1;visibility:visible;transform:none}

/* ---------- structured cards ---------- */
.card{background:var(--card);border-radius:var(--r-l);overflow:hidden;max-width:100%;font-family:var(--sans);font-size:14.5px}
.card-h{display:flex;align-items:flex-start;gap:10px;padding:16px 18px 12px;flex-wrap:wrap}
.card-h .k,.sec>.k{font:500 10.5px var(--mono);letter-spacing:.09em;color:var(--muted);text-transform:uppercase;display:block}
.card-h .k{margin-bottom:4px}
.card-h h3{margin:0;font:500 20px/1.25 var(--serif)}
.card-h .grow{flex:1;min-width:0}
.generated-media>img,.generated-media>video{display:block;width:100%;max-width:100%;height:auto;max-height:70vh;object-fit:contain;object-position:center;background:#000;margin:0 auto}
.generated-media>video{aspect-ratio:16/9}
.sec{padding:12px 18px;border-top:1px solid var(--line)}
.sec>.k{margin-bottom:6px}
.sec p{margin:0}
.note{display:flex;gap:9px;padding:10px 12px;border-radius:12px;font-size:13.5px;line-height:1.5;margin-top:10px;background:color-mix(in srgb,var(--warn) 12%,transparent)}
.kvr{display:flex;gap:12px;padding:10px 18px;border-top:1px solid var(--line);font-size:14px}
.kvr b{font:500 12px var(--mono);color:var(--muted);width:72px;flex:none;padding-top:2px}
.kvr span{flex:1;min-width:0;overflow-wrap:anywhere}
details>summary{list-style:none;cursor:pointer}
details>summary::-webkit-details-marker{display:none}
.claim{border-top:1px solid var(--line)}
.claim>summary{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:flex-start;padding:12px 18px}
.claim .n{font:500 12px var(--mono);color:var(--muted);padding-top:3px;width:16px;flex:none}
.claim .ct{flex:1 1 60%;min-width:0;overflow-wrap:anywhere}
.claim svg.i.chev{margin-top:4px}
.claim .pill{margin-left:26px}
.checks{padding:0 18px 14px 44px;display:flex;flex-direction:column;gap:8px}
.check{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:13px;color:var(--muted)}
.check b{font:500 12px var(--mono);color:var(--fg)}
.src{padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.src:first-child{border-top:0}
.src b{font:500 12px var(--mono);color:var(--accent);margin-right:6px}
.src small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px;overflow-wrap:anywhere}
.fold{border-top:1px solid var(--line)}
.fold>summary{display:flex;align-items:center;gap:8px;padding:13px 18px;font-weight:500;font-size:14px}
.fold>.in{padding:0 18px 14px;font-size:13.5px;color:var(--muted);display:flex;flex-direction:column;gap:5px}
.duo>div{padding:14px 18px;border-top:1px solid var(--line);min-width:0}
.duo .who{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-weight:600;font-size:13px}
.duo .who span{font:400 11px var(--mono);color:var(--muted)}
.verdict{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.stage{display:flex;gap:12px;align-items:center;padding:11px 18px;border-top:1px solid var(--line);font-size:14px}
.stage .st{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;flex:none;border:1.8px solid var(--card2);color:#fff}
.stage.completed .st{background:var(--good);border-color:var(--good)}
.stage.failed .st{background:var(--bad);border-color:var(--bad)}
.stage.running .st{border-color:var(--accent);border-top-color:transparent;animation:spin .9s linear infinite}
.stage .st svg{width:12px;height:12px;stroke-width:2.8}
.stage .lbl{flex:1;min-width:0}.stage .s{font:500 11px var(--mono);color:var(--muted)}
.stage.pending{color:var(--muted)}
@keyframes spin{to{transform:rotate(360deg)}}
.bar{height:5px;background:var(--card2);border-radius:5px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .4s}
.card-btns{display:flex;gap:8px;padding:12px 18px 16px;border-top:1px solid var(--line)}
.sbtn{padding:9px 16px;border-radius:999px;background:var(--card2);font:500 13.5px var(--sans)}
.pat{padding:14px 18px;border-top:1px solid var(--line)}
.pat .head{display:flex;gap:10px;align-items:flex-start;margin-bottom:6px}.pat .head p{flex:1;margin:0;font-weight:500}
.pat ul{list-style:none;margin:0 0 6px;padding:0;color:var(--muted);font-size:13px}
.pat ul li{padding:2px 0;overflow-wrap:anywhere}.pat ul b{font:500 11.5px var(--mono);color:var(--fg);margin-right:6px}
.pat .meta{font-size:13px;color:var(--muted)}.pat .meta b{color:var(--fg);font-weight:500}
.chain{font:500 13px var(--mono);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;margin-bottom:6px}.chain em{font-style:normal;color:var(--muted)}
.tw{overflow-x:auto}
table.roles{width:100%;border-collapse:collapse;font-size:13.5px}
table.roles td,table.roles th{padding:11px 18px;text-align:left;border-top:1px solid var(--line);vertical-align:top}
table.roles th{font:500 10.5px var(--mono);letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
table.roles td:first-child{font:500 12.5px var(--mono);white-space:nowrap}
table.roles .arrow{color:var(--muted);margin:0 4px}

/* ask (structured question) */
.ask .card-h{padding-bottom:4px}
.ask .q{padding:4px 18px 12px;display:flex;flex-direction:column;gap:8px}
.ask .hd{align-self:flex-start;font:500 11px var(--mono);letter-spacing:.06em;background:var(--card2);color:var(--muted);padding:4px 8px;border-radius:7px;text-transform:uppercase}
.ask .qt{margin:0;font:500 20px/1.3 var(--serif)}
.opts{display:flex;flex-direction:column;gap:8px;padding:0 14px 6px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:13px 14px;border-radius:16px;background:var(--card2);border:1.5px solid transparent;width:100%;text-align:left}
.opt.on{border-color:var(--sel);background:color-mix(in srgb,var(--sel) 10%,var(--card2))}
.opt .mk{width:22px;height:22px;border-radius:50%;border:1.8px solid var(--muted);flex:none;margin-top:1px;display:grid;place-items:center;color:#fff}
.opt .mk.sq{border-radius:7px}
.opt.on .mk{background:var(--sel);border-color:var(--sel)}
.opt .mk svg{width:14px;height:14px;stroke-width:3}
.opt .ot{display:flex;flex-direction:column;min-width:0}
.opt .ot b{font-weight:500}
.opt .ot small{color:var(--muted);font-size:13.5px;line-height:1.35}
.opt.other{align-items:center;cursor:text}
.opt.other input{flex:1;min-width:0;background:transparent;border:0;outline:0;padding:0}
.opt.other input::placeholder{color:var(--muted)}
.ask-foot{display:flex;align-items:center;gap:8px;padding:10px 14px 16px}
.ask-foot .sp{flex:1}
.pg{display:flex;gap:5px;align-items:center}
.pg i{width:6px;height:6px;border-radius:50%;background:var(--card2)}
.pg i.on{background:var(--accent)}
.approve .decided{display:flex;gap:8px;align-items:center;padding:12px 18px 16px;border-top:1px solid var(--line);font-size:14px}
.approve .decided.allow{color:var(--good)}.approve .decided.deny{color:var(--bad)}.approve .decided.expired{color:var(--muted)}
.approve.risk-high{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--bad) 55%,transparent)}
.chipcard{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:18px;padding:12px 14px;max-width:100%;font-family:var(--sans)}
.chipcard .ci{width:36px;height:36px;border-radius:50%;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);display:grid;place-items:center;flex:none}
.chipcard .ct{flex:1;min-width:0;display:flex;flex-direction:column;font-size:14.5px}
.chipcard .ct b{font-weight:500}.chipcard .ct span{color:var(--muted);overflow-wrap:anywhere}
.chipcard.gone{opacity:.6}

/* ---------- drawer ---------- */
.scrim{position:absolute;inset:0;z-index:20;background:rgba(0,0,0,.42);opacity:0;visibility:hidden;transition:opacity .22s,visibility .22s}
.open .scrim{opacity:1;visibility:visible}
.drawer{position:absolute;top:0;bottom:0;left:0;width:86%;max-width:340px;background:var(--bg);z-index:21;transform:translateX(-102%);transition:transform .24s ease,visibility .24s;display:flex;flex-direction:column;min-height:0;visibility:hidden;border-right:1px solid var(--line);box-shadow:var(--sh2)}
.open .drawer{transform:none;visibility:visible}
.d-top{display:flex;align-items:center;min-height:60px;gap:2px;padding-top:4px}
.d-top .wm{font:500 25px/1 var(--serif);flex:1;letter-spacing:.04em}
.d-top input{flex:1;min-width:0;border:0;outline:0;background:var(--card);border-radius:999px;padding:11px 18px}
.d-nav{display:flex;flex-direction:column;gap:2px;padding-top:2px}
.d-nav button{display:flex;align-items:center;gap:14px;padding:10px 12px;border-radius:var(--r-m);font:500 15.5px var(--sans);width:100%}
.d-nav button svg{color:var(--muted)}
.d-nav button:active{background:var(--card)}
.d-nav button[aria-current="true"]{background:var(--card);color:var(--accent)}
.d-nav button[aria-current="true"] svg{color:var(--accent)}
.d-nav .badge{margin-left:auto;color:var(--muted);font:500 12px var(--mono)}
.rule{height:1px;background:var(--line);margin:10px 0 6px}
.d-label{color:var(--muted);padding:0 8px 8px;font-size:15px}
.d-group{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:12px 12px 4px}
.d-list{flex:1;min-height:0;overflow-y:auto;padding-bottom:12px}
.rc{display:flex;align-items:center;gap:8px;border-radius:var(--r-m);padding:9px 6px 9px 12px;font-size:15px;width:100%;cursor:pointer}
.rc span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rc:active{background:var(--card)}
.rc[aria-current="true"]{background:var(--card2)}
.rc .del{flex:none;width:30px;height:30px;display:grid;place-items:center;border-radius:50%;color:var(--muted);opacity:.55}
.rc .del:hover,.rc .del:active{background:var(--line);color:var(--bad);opacity:1}
.d-empty{color:var(--muted);padding:8px 12px;font-size:14px}
.d-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:12px;padding-bottom:max(14px,env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.acct{display:flex;align-items:center;gap:10px;min-width:0;border-radius:var(--r-m);padding:4px 8px 4px 0}
.acct .an{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.acct .an b{font:500 14.5px var(--sans);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct .an small{color:var(--muted);font-size:12px}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font:600 15px var(--sans);flex:none}
.fab{height:44px;padding:0 18px 0 14px;border-radius:22px;background:var(--fg);color:var(--bg);display:flex;align-items:center;gap:8px;font:500 15px var(--sans);flex:none}

/* ---------- list screens ---------- */
.grp{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.item{background:var(--card);border-radius:0;padding:0 16px;min-height:56px;display:flex;align-items:center;gap:14px;width:100%;transition:background .16s ease}
.item:active{background:var(--card2)}
:not(.grp)>.item{border-radius:12px}
button.item:active{background:var(--card2)}
:not(.grp)>.item{border-radius:12px}
.item>.t{flex:1;min-width:0;display:flex;flex-direction:column;padding:12px 0}
.item>.t small{color:var(--muted);font-size:12.5px;line-height:1.35;letter-spacing:.005em;font-family:var(--mono)}
.item>svg.i{color:var(--fg)}
.item.col2{flex-direction:column;align-items:stretch;gap:14px;padding:18px}
.item.col2 .tt{display:flex;align-items:center;gap:18px}
.prof{display:flex;align-items:center;gap:14px;padding:14px 0;width:100%}
.prof .avatar{width:48px;height:48px}
.prof .t{flex:1;min-width:0}.prof .t b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis}
.prof .t small{color:var(--muted)}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.themes button{display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--muted);font-size:15.5px}
.tile{width:100%;aspect-ratio:1.5;border-radius:20px;padding:9px;border:3px solid transparent;display:block}
.tile i{display:block;width:100%;height:100%;border-radius:12px;position:relative;border:1px solid rgba(128,128,128,.35)}
.tile i::before{content:"";position:absolute;left:12px;top:12px;width:44%;height:4px;border-radius:4px;background:#8885;box-shadow:0 9px 0 0 #8885}
.tile i::after{content:"";position:absolute;right:10px;bottom:10px;width:14px;height:14px;border-radius:50%;background:#D0623A}
.tl .tile{background:#F3F1EC}.tl i{background:#fff}
.td .tile{background:#111}.td i{background:#1E1E1E}
.ts .tile{background:linear-gradient(135deg,#F3F1EC 50%,#111 50%)}.ts i{background:linear-gradient(135deg,#fff 50%,#1E1E1E 50%)}
.themes button[aria-pressed="true"]{color:var(--sel)}
.themes button[aria-pressed="true"] .tile{border-color:var(--sel)}
.mem{display:flex;gap:12px;align-items:flex-start;background:var(--card);border-radius:20px;padding:14px 8px 14px 18px}
.mem .id{font:500 12px var(--mono);color:var(--muted);padding-top:4px;flex:none}
.mem p{margin:0;flex:1;min-width:0;overflow-wrap:anywhere}
.mem button{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--muted);flex:none;margin-top:-4px}
.mem button:active{background:var(--card2);color:var(--bad)}
.mem button[aria-pressed="true"]{color:var(--accent)}
.empty{color:var(--muted);text-align:center;padding:40px 20px;display:flex;flex-direction:column;gap:14px;align-items:center}
.addbar{display:flex;gap:8px;padding-top:8px;padding-bottom:12px}
.addbar input,.sheet input[type=text],.sheet input[type=password],.sheet input[type=url],.sheet input[type=datetime-local],.search{flex:1;min-width:0;border:0;outline:0;background:var(--card);border-radius:999px;padding:13px 18px;width:100%}
.addbar .go,.sheet .go{background:var(--accent);color:var(--accent-fg);border-radius:999px;padding:0 20px;font-weight:500;height:48px;flex:none}

/* today */
.today-hero{padding:8px 0 2px;display:flex;flex-direction:column;gap:8px}
.today-hero h2{font:400 clamp(30px,8vw,38px)/1.1 var(--serif);margin:0;letter-spacing:-.01em}
.today-hero p{color:var(--muted);margin:0}
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qbtn{background:var(--card);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px;min-height:92px;text-align:left}
.qbtn:active{background:var(--card2)}
.qbtn svg{color:var(--accent)}
.qbtn b{font-weight:500}
.sech{display:flex;align-items:center;justify-content:space-between;margin:8px 4px -6px;color:var(--muted);font:500 12px var(--mono);letter-spacing:.08em;text-transform:uppercase}
.sech button{color:var(--sel);font:500 13px var(--sans);text-transform:none;letter-spacing:0}
.sug .t small{display:block}
.sug>svg.i:last-child{color:var(--muted)}

/* tasks */
.task{display:flex;gap:14px;align-items:center;background:var(--card);padding:10px 6px 10px 16px;border-radius:6px;min-height:62px}
.task:first-child{border-radius:18px 18px 6px 6px}.task:last-child{border-radius:6px 6px 18px 18px}.task:only-child{border-radius:18px}
.cb{width:26px;height:26px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;color:#fff;flex:none}
.cb.on{background:var(--good);border-color:var(--good)}
.cb svg{width:15px;height:15px;stroke-width:3}
.task .tt{flex:1;min-width:0;display:flex;flex-direction:column;text-align:left}
.task .tt b{font-weight:500;overflow-wrap:anywhere}
.task.done .tt b{text-decoration:line-through;color:var(--muted)}
.due{font:500 12px var(--mono);color:var(--muted)}.due.bad{color:var(--bad)}.due.warn{color:var(--warn)}
.task .del{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--muted);flex:none}
.task .del:active{background:var(--card2);color:var(--bad)}

/* abilities */
.abil{align-items:flex-start;padding-top:14px;padding-bottom:14px}
.abil .ico{width:40px;height:40px;border-radius:12px;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);display:grid;place-items:center;flex:none}
.abil .t{padding:0}
.abil .t b{font-weight:500}
.abil .t small{display:block;margin-top:2px}
.abil .try{align-self:flex-start;margin-top:8px;font:500 12px var(--mono);color:var(--sel);background:color-mix(in srgb,var(--sel) 12%,transparent);padding:6px 10px;border-radius:10px;text-align:left;max-width:100%;overflow-wrap:anywhere}
.abil .tag{margin-left:6px;vertical-align:2px}
.abil .swb{padding-top:6px}

/* ---------- toast / banner ---------- */
.toasts{position:absolute;left:0;right:0;bottom:104px;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;z-index:35;padding:0 16px}
.toast{pointer-events:auto;background:var(--fg);color:var(--bg);padding:10px 10px 10px 18px;border-radius:999px;display:flex;gap:10px;align-items:center;box-shadow:var(--shadow);font-size:14.5px;max-width:100%;animation:up .2s ease}
.toast .tbtn{font-weight:600;padding:6px 12px;border-radius:999px;color:var(--accent)}
.banners{position:absolute;top:8px;left:0;right:0;z-index:50;display:flex;flex-direction:column;gap:8px;pointer-events:none;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.banner{pointer-events:auto;background:var(--card2);border-radius:20px;padding:12px 14px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow);animation:down .25s ease}
.banner svg{color:var(--accent)}
.banner .bt{flex:1;min-width:0;display:flex;flex-direction:column}.banner .bt small{color:var(--muted)}
.banner .sbtn{background:var(--bg)}
@keyframes up{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes down{from{transform:translateY(-12px);opacity:0}to{transform:none;opacity:1}}

/* ---------- report card (PDF is offered, never auto-saved) ---------- */
.pdfcard{display:flex;align-items:center;gap:12px;margin-top:10px;padding:10px 10px 10px 14px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.pdfcard>svg{color:var(--accent);flex:none}
.pdfcard .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.pdfcard .t b{font-weight:500;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pdfcard .t small{font:500 11px var(--mono);color:var(--muted);letter-spacing:.03em}
.pdfcard .btn{height:36px;padding:0 16px;border-radius:10px;font-size:13.5px;flex:none}
/* ---------- sheets ---------- */
.shade{position:absolute;inset:0;z-index:30;background:rgba(0,0,0,.52);display:flex;align-items:flex-end;animation:fade .2s ease}
.shade.top{z-index:70}
.sheet{background:var(--bg);border-radius:24px 24px 0 0;width:100%;max-height:90%;display:flex;flex-direction:column;padding-top:8px;border-top:1px solid color-mix(in srgb,var(--fg) 10%,transparent);box-shadow:0 -18px 44px rgba(0,0,0,.22);animation:up .3s cubic-bezier(.22,1,.36,1)}
.sheet.tall{height:90%}
.sheet .grab{width:40px;height:4px;border-radius:4px;background:var(--card2);margin:0 auto 6px}
.sh-h{display:flex;align-items:center;justify-content:space-between}
.sh-h h3{margin:0;font:600 16.5px/1.2 var(--sans);letter-spacing:-.01em;padding:6px 0}
.sh-h .ib{width:40px;height:40px;margin-right:-8px}
.sheet .body{overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding-top:8px;padding-bottom:max(18px,env(safe-area-inset-bottom,0px))}
.sheet label.l{font:500 10.5px var(--mono);letter-spacing:.13em;color:var(--muted);text-transform:uppercase}
.fld{display:flex;flex-direction:column;gap:8px}
.inline{display:flex;align-items:center;gap:10px}
.inline p{flex:1;min-width:0}
.sheet form,.frow{display:flex;gap:8px;align-items:center}
.sheet p{margin:0;color:var(--muted);font-size:13px;line-height:1.5}
.kv{display:flex;gap:10px;align-items:center;background:var(--card);border-radius:16px;padding:10px 8px 10px 16px}

.opt-row{display:flex;gap:14px;align-items:center;width:100%;background:var(--card);border-radius:18px;padding:14px 16px;text-align:left}
.opt-row:active{background:var(--card2)}

.opt-row .t{flex:1;display:flex;flex-direction:column}.opt-row small{color:var(--muted)}
.lib-view{overflow-y:auto}

/* ---------- voice mode ---------- */
.voice{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;background:radial-gradient(120% 70% at 50% 28%,color-mix(in srgb,var(--accent) 16%,var(--bg)),var(--bg) 72%)}
.v-top{display:flex;align-items:center;justify-content:space-between;min-height:64px;padding-top:6px}
.v-mid{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:0 24px}
.orb{position:relative;width:min(56vw,236px);aspect-ratio:1;border-radius:50%;display:block;flex:none}
.orb .r{position:absolute;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--accent) 65%,transparent)}
.orb .r1{inset:16%}.orb .r2{inset:6%;opacity:.7}.orb .r3{inset:-6%;opacity:.4}
.orb .core{position:absolute;inset:28%;border-radius:50%;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--accent) 65%,#fff),var(--accent) 55%,color-mix(in srgb,var(--accent) 55%,#000));box-shadow:0 0 50px color-mix(in srgb,var(--accent) 55%,transparent),inset 0 0 18px rgba(255,255,255,.25)}
.orb .arc{position:absolute;inset:9%;border-radius:50%;border:3px solid transparent;border-top-color:var(--accent);border-right-color:color-mix(in srgb,var(--accent) 35%,transparent);opacity:0}
.voice[data-state="idle"] .core{animation:breathe 4.2s ease-in-out infinite}
.voice[data-state="listening"] .r{animation:ping 1.6s ease-out infinite}
.voice[data-state="listening"] .r2{animation-delay:.35s}.voice[data-state="listening"] .r3{animation-delay:.7s}
.voice[data-state="listening"] .core{animation:breathe 1.6s ease-in-out infinite}
.voice[data-state="thinking"] .arc{opacity:1;animation:spin 1.1s linear infinite}
.voice[data-state="speaking"] .core{animation:talk .45s ease-in-out infinite alternate}
.voice[data-state="speaking"] .r{animation:wave 1s ease-in-out infinite alternate}
.voice[data-state="speaking"] .r2{animation-delay:.2s}.voice[data-state="speaking"] .r3{animation-delay:.4s}
@keyframes breathe{0%,100%{transform:scale(.96)}50%{transform:scale(1.05)}}
@keyframes ping{0%{transform:scale(.92);opacity:.7}100%{transform:scale(1.22);opacity:0}}
@keyframes talk{from{transform:scale(.93)}to{transform:scale(1.1)}}
@keyframes wave{from{transform:scale(.97)}to{transform:scale(1.07)}}
.v-state{font:500 24px/1.2 var(--serif);margin:0;text-align:center}
.v-cap{max-width:36ch;text-align:center;color:var(--muted);min-height:64px;max-height:28vh;overflow-y:auto;font-size:16px;display:flex;flex-direction:column;gap:8px}
.v-cap .u{color:var(--fg)}
.v-foot{display:flex;flex-direction:column;gap:12px;padding-top:8px;padding-bottom:14px}
.v-type{display:flex;gap:8px;align-items:center}
.v-type input{flex:1;min-width:0;border:0;outline:0;background:var(--card);border-radius:999px;padding:13px 18px}
.v-btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.chipbtn{font:500 13px var(--sans);padding:8px 14px;border-radius:999px;background:var(--card);color:var(--muted)}
.chipbtn[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}

/* ---------- lock ---------- */
.lock{position:absolute;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px}
.lock h2{margin:0;font:500 28px var(--serif);letter-spacing:.02em}
.lock .lk-msg{margin:0;color:var(--muted);min-height:1.5em;text-align:center}

.pinhost{display:flex;flex-direction:column;align-items:center;gap:26px}
.pin-dots{display:flex;gap:16px;height:16px}
.pin-dots i{width:15px;height:15px;border-radius:50%;border:2px solid var(--muted)}
.pin-dots i.on{background:var(--fg);border-color:var(--fg)}
.pin-dots.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-7px)}80%{transform:translateX(7px)}}
.keypad{display:grid;grid-template-columns:repeat(3,72px);gap:14px 22px}
.key{width:72px;height:72px;border-radius:50%;background:var(--card);font:500 26px var(--sans);display:grid;place-items:center;text-align:center}
.key:active{background:var(--card2)}
.key.blank{background:none}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}

.srcchip{display:flex;align-items:center;gap:6px;background:var(--card2);color:var(--fg);border-radius:14px;padding:8px 12px;font-size:13px}
.ansbox{width:100%;min-height:140px;background:var(--card);border:0;border-radius:16px;padding:12px;font:13px var(--mono);color:var(--fg);resize:vertical}

.notes{background:var(--card);border-radius:14px;font-family:var(--sans);margin-top:8px}
.notes>summary{display:flex;gap:8px;align-items:center;padding:10px 14px;font-size:13px;color:var(--muted);cursor:pointer;list-style:none}
.notes>summary::-webkit-details-marker{display:none}
.notes .note-item{padding:4px 14px 10px;font-size:13.5px;border-top:1px solid color-mix(in srgb,var(--fg) 8%,transparent)}
.notes .note-item>b{display:block;font-size:12px;color:var(--muted);margin:6px 0 2px;font-weight:500}

/* ---- Thinking block (live lines, then "Thought for Ns") + the full "Kisne kya socha" page */
.think2{background:transparent;border-radius:14px;cursor:pointer;font-family:var(--sans);color:var(--muted);outline:none;-webkit-tap-highlight-color:transparent}
.think2 .th{display:flex;align-items:center;gap:10px;font:400 14.5px var(--sans);min-height:32px}
.think2 .chv{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:16px;color:var(--muted)}
.think2 .chv .chev{transition:transform .2s;transform:rotate(90deg)}.think2.open .chv .chev{transform:rotate(-90deg)}
.think2 .tl{margin:2px 0 4px 3px;padding-left:14px;border-left:2px solid var(--line);font-size:14px;line-height:1.55;overflow:hidden}
.think2.run .tl{max-height:6.4em;-webkit-mask-image:linear-gradient(to bottom,transparent,#000 45%);mask-image:linear-gradient(to bottom,transparent,#000 45%)}
.think2.run.open .tl,.think2.open .tl{max-height:46vh;overflow-y:auto;-webkit-mask-image:none;mask-image:none}
.think2:not(.run):not(.open) .tl{display:none}
.tline{padding:2px 0;color:var(--muted);overflow-wrap:anywhere}
.think2.run .tline:last-child{color:var(--fg)}
.council{z-index:30;background:var(--bg)}
.council .hdr h1{font-size:18px}
.cn{gap:22px}
.cn .qline{margin:0;font-style:italic}
.cn .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cn .stat{background:var(--card);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.cn .stat b{font:500 18px var(--sans)}.cn .stat small{color:var(--muted);font-size:11.5px;overflow-wrap:anywhere}
.cn .k{font:500 10.5px var(--mono);letter-spacing:.09em;color:var(--muted);text-transform:uppercase;display:block;margin:6px 0 2px}
.cn .tlist{display:flex;flex-direction:column;background:var(--card);border-radius:14px;overflow:hidden}
.cn .tlrow{display:flex;align-items:center;gap:10px;padding:10px 14px;text-align:left;font:400 14px var(--sans);border-top:1px solid color-mix(in srgb,var(--fg) 7%,transparent)}
.cn .tlrow:first-child{border-top:0}.cn .tlrow b{font-weight:500;white-space:nowrap}.cn .tlrow .muted{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px}
.cn .tlrow .chev{opacity:.6}
.csec{display:flex;flex-direction:column;gap:10px;scroll-margin-top:8px}
.csec>h2{margin:0;font:500 20px var(--serif)}
.csec ul,.csec ol{margin:0;padding-left:1.2em;font-size:14px}.csec li{margin:.25em 0;overflow-wrap:anywhere}
.cn .kv{display:flex;gap:10px;font-size:14px;align-items:baseline}.cn .kv .k{flex:0 0 120px;margin:0}.cn .kv span:last-child{min-width:0;overflow-wrap:anywhere}
.cn .warn{color:var(--warn);font-size:13.5px;margin:0}
.ccard{background:var(--card);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.ccard.bad{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--bad) 45%,transparent)}
.ccard .ch{display:flex;align-items:center;gap:8px;justify-content:space-between}.ccard .ch b{font-weight:500;min-width:0;overflow-wrap:anywhere}
.ccard p{margin:0}
.ccard .ml{font:400 12.5px var(--mono);color:var(--muted);overflow-wrap:anywhere}
.ccard .skips{font:400 12px var(--mono);color:var(--muted);overflow-wrap:anywhere}
.fold{background:var(--card2);border-radius:10px}
.fold>summary{display:flex;gap:8px;align-items:center;padding:8px 10px;font-size:13px;color:var(--muted);cursor:pointer;list-style:none}
.fold>summary::-webkit-details-marker{display:none}.fold[open]>summary .chev{transform:rotate(90deg)}
.fold .fb{padding:2px 12px 12px;font-size:14px;overflow-x:auto}
pre.raw{margin:0 0 6px;white-space:pre-wrap;overflow-wrap:anywhere;font:400 12.5px/1.5 var(--mono);color:var(--fg)}
.cn .conf{background:var(--card);border-radius:12px;padding:10px 12px;font-size:13.5px;display:flex;flex-direction:column;gap:4px}
.cn .bars{display:flex;flex-direction:column;gap:6px}
.cn .bar{display:grid;grid-template-columns:110px 1fr auto;gap:8px;align-items:center;font-size:12.5px}
.cn .bar i{display:block;height:8px;border-radius:4px;background:var(--accent);min-width:3px}
.cn .bar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cn .bar b{font:500 11.5px var(--mono);color:var(--muted)}
.cn .ps{font-size:13.5px;padding:6px 0;border-top:1px solid color-mix(in srgb,var(--fg) 7%,transparent)}.cn .ps:first-child{border-top:0}
.tl.big{max-height:60vh;overflow-y:auto;border-left:2px solid var(--line);padding-left:14px}

/* ---------- settings groups ---------- */
.glabel{display:flex;align-items:center;gap:7px;font:500 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:12px 2px 0;margin-bottom:-8px}
.buildline{text-align:center;font:500 10.5px var(--mono);letter-spacing:.12em;color:var(--muted);opacity:.75;padding:6px 0 2px}
.glabel::before{content:"";width:3px;height:9px;border-radius:1px;background:var(--accent);flex:none}
.stack>.glabel:first-child{padding-top:0}

/* ---------- model calls: live panel in the chat (toggle in the header) ---------- */
.hdr{grid-template-columns:44px minmax(0,1fr) auto}
.hdr-r{display:flex;align-items:center;justify-content:flex-end;gap:0}
.ib.on{color:var(--accent)}
.mcalls{margin:0 2px 8px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden}
.mcalls .mch{display:flex;align-items:center;gap:7px;padding:6px 6px 6px 12px;font:500 12px/1.2 var(--sans);color:var(--fg)}
.mcalls .mch b{font-weight:600}
.mcalls .mch .muted{font:500 11px/1 var(--mono);color:var(--muted)}
.mcalls .mch .sp{flex:1}
.mcalls .mch .ib{width:30px;height:30px}
.mcl{max-height:34vh;overflow:auto;border-top:1px solid var(--line);padding:4px 0}
.mcr{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:5px 12px;font:500 11.5px/1.35 var(--mono);color:var(--muted)}
.mcr .st{color:var(--fg);font-family:var(--sans);font-size:12px}
.mcr .md{grid-column:1;color:var(--muted);word-break:break-all}
.mcr .ms{grid-column:2;grid-row:1;color:var(--muted);white-space:nowrap}
.mcr .why{grid-column:1/-1;color:var(--bad);font-size:11px;line-height:1.3;word-break:break-word}
.mcr.ok .ms{color:var(--good)}
.mcr.bad .ms{color:var(--bad)}
.mcr.run .ms{color:var(--warn)}
.mcr.run .st::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--warn);margin-right:6px;vertical-align:1px;animation:mc-pulse 1s infinite}
@keyframes mc-pulse{50%{opacity:.25}}
.mcalls-msg .mcl{max-height:none;border-top:0}
.pop-item small.pi-how{font-size:11.5px;color:var(--fg2);opacity:.8}
.combo-t{width:100%;border-collapse:collapse;font-size:13px}.combo-t td{padding:3px 6px;border-top:1px solid var(--line,rgba(127,127,127,.18))}.combo-t td:first-child{color:var(--muted);white-space:nowrap}

/* ---------- Standard-mode actions (Adarsh) ---------- */
.act{padding:14px 14px 10px}
.act-h{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:14.5px}
.act-h b{font-weight:600;line-height:1.35}
.act-badge{font-size:9.5px;letter-spacing:.14em;font-weight:700;padding:3px 7px;border-radius:6px;background:var(--acc,#3b6ef5);color:#fff;flex:none}
.act-steps{display:flex;flex-direction:column;gap:2px}
.act-step{display:flex;align-items:center;gap:10px;padding:8px 4px;border-radius:10px}
.act-step+.act-step{border-top:1px solid var(--line,rgba(0,0,0,.07))}
.as-ic{width:28px;height:28px;flex:none;display:grid;place-items:center;border-radius:9px;background:var(--card2,rgba(0,0,0,.05))}
.as-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.as-t b{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.as-t small{font-size:12px;color:var(--muted);line-height:1.35}
.as-s{flex:none;font-size:13px;color:var(--muted);min-width:14px;text-align:center}

.act-step[data-state="fail"] .as-s{color:var(--bad,#d33)}

.act-step[data-state="ok"] .as-ic{background:color-mix(in srgb,var(--good,#18a05a) 14%,transparent)}
.act-step[data-state="fail"] .as-ic{background:color-mix(in srgb,var(--bad,#d33) 14%,transparent)}

/* working HUD: a small orb at the top while a task runs */
.hud{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translate(-50%,-16px);z-index:60;
  display:flex;align-items:center;gap:10px;padding:8px 14px 8px 10px;border-radius:999px;
  background:rgba(18,20,26,.92);color:#fff;font-size:13px;box-shadow:0 8px 30px rgba(0,0,0,.28);
  opacity:0;pointer-events:none;transition:opacity .22s ease,transform .22s ease;max-width:min(92vw,420px)}
.hud.on{opacity:1;transform:translate(-50%,0)}
.hud-t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hud-orb{position:relative;width:20px;height:20px;flex:none;display:grid;place-items:center}
.hud-orb i{position:absolute;inset:0;border-radius:50%;border:1.5px solid rgba(120,170,255,.85);opacity:0}
.hud.busy .hud-orb i{animation:hudpulse 1.5s ease-out infinite}
.hud.busy .hud-orb i:nth-child(2){animation-delay:.5s}
.hud.busy .hud-orb i:nth-child(3){animation-delay:1s}
.hud-orb:after{content:'';width:7px;height:7px;border-radius:50%;background:#7fb0ff;box-shadow:0 0 10px #7fb0ff}
@keyframes hudpulse{0%{opacity:.85;transform:scale(.45)}100%{opacity:0;transform:scale(1.5)}}
@media (prefers-reduced-motion: reduce){.hud.busy .hud-orb i{animation:none}.hud{transition:none}}
/* API keys sheet: one fold per provider, 3 key slots inside */

/* =====================================================================================
   ADARSH UI : boot.css   (startup animation, driven by js/07-splash.js)
   A dark "tech HUD" intro over the app on a cold start: spinning rings, a moving grid floor, a scan line,
   the name decoding letter by letter, a short boot log and a progress bar, then a zoom-and-fade into the app.
   The layer is static markup in index.html, so it is the very first paint: only the dark ground (no static "A")
   until the HUD starts, then the "A" fades in with it. Only transform / opacity are animated (cheap in the WebView).
   S.settings.bootAnim=false (AI command) turns it off. A tap skips it. Reduced motion = a short fade.
   ===================================================================================== */
.boot{position:fixed;inset:0;z-index:1000;overflow:hidden;background:#05070B;color:#DCE7EF;font-family:var(--mono);
  -webkit-user-select:none;user-select:none;touch-action:none;
  --bc:#49D9FF;--bc2:rgba(73,217,255,.32);--bc3:rgba(73,217,255,.13);--ba:#FF8A5B;--bm:#6B8092;--ok:#59F2B4;
  --hud:min(66vw,270px,36vh);
  /* fail-safe: even if the script never runs, the layer can not stay over the app */
  animation:boot-failsafe .35s linear 7s forwards}
@keyframes boot-failsafe{to{opacity:0;visibility:hidden;pointer-events:none}}
@keyframes boot-fade{to{opacity:1}}

/* dot field (upper half) + vignette */
.boot::before{content:'';position:absolute;inset:0;opacity:0;pointer-events:none;
  background-image:radial-gradient(rgba(73,217,255,.17) 1px,transparent 1.3px);background-size:22px 22px;
  -webkit-mask-image:radial-gradient(ellipse 75% 55% at 50% 38%,#000,transparent 78%);mask-image:radial-gradient(ellipse 75% 55% at 50% 38%,#000,transparent 78%)}
.boot::after{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 90% 70% at 50% 46%,transparent 48%,rgba(0,0,0,.72))}
.boot.go::before{animation:boot-fade 1s ease .2s forwards}

/* perspective grid floor that keeps moving towards the viewer */
.boot-floor{position:absolute;left:-60%;right:-60%;bottom:-8%;height:56%;overflow:hidden;opacity:0;pointer-events:none;
  transform:perspective(300px) rotateX(64deg);transform-origin:50% 100%;
  -webkit-mask-image:linear-gradient(to top,#000,rgba(0,0,0,.55) 45%,transparent 92%);mask-image:linear-gradient(to top,#000,rgba(0,0,0,.55) 45%,transparent 92%)}
.boot-floor i{position:absolute;left:0;right:0;top:-44px;bottom:0;
  background-image:linear-gradient(rgba(73,217,255,.26) 1px,transparent 1px),linear-gradient(90deg,rgba(73,217,255,.26) 1px,transparent 1px);background-size:44px 44px}
.boot.go .boot-floor{animation:boot-fade .8s ease .1s forwards}
.boot.go .boot-floor i{animation:boot-floor .7s linear infinite}
@keyframes boot-floor{to{transform:translateY(44px)}}

/* one scan line sweeping down the screen */
.boot-scan{position:absolute;left:0;right:0;top:-90px;height:90px;opacity:0;pointer-events:none;
  background:linear-gradient(to bottom,transparent,rgba(73,217,255,.06) 60%,rgba(73,217,255,.36) 96%,rgba(255,255,255,.75) 99%,transparent)}
.boot.go .boot-scan{animation:boot-scan 1.25s cubic-bezier(.45,0,.25,1) .12s 1 forwards}
@keyframes boot-scan{0%{opacity:1;transform:translateY(0)}85%{opacity:1}100%{opacity:0;transform:translateY(calc(100vh + 90px))}}

/* HUD frame: corner brackets + tags */
.boot-c{position:absolute;width:22px;height:22px;border:0 solid var(--bc2);opacity:0}
.boot-c.tl{top:calc(14px + env(safe-area-inset-top,0px));left:14px;border-top-width:1.5px;border-left-width:1.5px}
.boot-c.tr{top:calc(14px + env(safe-area-inset-top,0px));right:14px;border-top-width:1.5px;border-right-width:1.5px}
.boot-c.bl{bottom:calc(14px + env(safe-area-inset-bottom,0px));left:14px;border-bottom-width:1.5px;border-left-width:1.5px}
.boot-c.br{bottom:calc(14px + env(safe-area-inset-bottom,0px));right:14px;border-bottom-width:1.5px;border-right-width:1.5px}
.boot.go .boot-c{animation:boot-corner .5s cubic-bezier(.2,.8,.2,1) .15s forwards}
@keyframes boot-corner{from{opacity:0;transform:scale(1.9)}to{opacity:1;transform:none}}
.boot-tag{position:absolute;top:calc(19px + env(safe-area-inset-top,0px));font-size:9.5px;letter-spacing:.22em;color:var(--bm);opacity:0;white-space:nowrap}
.boot-tag.l{left:46px}
.boot-tag.r{right:46px;font-variant-numeric:tabular-nums}
.boot.go .boot-tag{animation:boot-fade .4s ease .35s forwards}

/* glow, rings and the "A" (all centred on the screen, like the Android splash icon) */
.boot-glow{position:absolute;left:50%;top:50%;width:calc(var(--hud) * 1.3);height:calc(var(--hud) * 1.3);
  margin:calc(var(--hud) * -.65) 0 0 calc(var(--hud) * -.65);border-radius:50%;opacity:0;pointer-events:none;
  background:radial-gradient(circle,rgba(73,217,255,.22),rgba(73,217,255,.06) 42%,transparent 68%)}
.boot-glow::after{content:'';position:absolute;inset:0;border-radius:50%;opacity:0;transition:opacity .35s ease;
  background:radial-gradient(circle,rgba(255,138,91,.30),rgba(255,138,91,.08) 42%,transparent 68%)}
.boot.go .boot-glow{animation:boot-fade .6s ease .15s forwards,boot-breathe 1.6s ease-in-out .75s infinite alternate}
@keyframes boot-breathe{from{transform:scale(1)}to{transform:scale(1.08)}}
.boot.ready .boot-glow::after{opacity:1}

.boot-ring{position:absolute;left:50%;top:50%;width:var(--hud);height:var(--hud);margin:calc(var(--hud) / -2) 0 0 calc(var(--hud) / -2);
  opacity:0;transform:scale(1.35)}
.boot.go .boot-ring{opacity:1;transform:none;transition:opacity .45s ease .08s,transform .8s cubic-bezier(.2,.8,.2,1) .05s}
.boot-hud{display:block;width:100%;height:100%;overflow:visible}
.boot-hud circle{fill:none;transform-box:fill-box;transform-origin:center}
.boot-hud .h0{stroke:var(--bc3);stroke-width:1}
.boot-hud .h1{stroke:var(--bc2);stroke-width:5;stroke-dasharray:.8 4.4}
.boot-hud .h2{stroke:var(--bc);stroke-width:1.6;stroke-dasharray:70 22 14 22 110 30 40 30 60 104;transition:stroke .3s ease}
.boot-hud .h3{stroke:var(--bc2);stroke-width:1;stroke-dasharray:428;stroke-dashoffset:428}
.boot-hud .h4{stroke:var(--ba);stroke-width:2.2;stroke-linecap:round;stroke-dasharray:26 402}
.boot.go .boot-hud .h1{animation:boot-spin 14s linear infinite}
.boot.go .boot-hud .h2{animation:boot-spin-r 5s linear infinite}
.boot.go .boot-hud .h3{animation:boot-dash 1s ease-out .2s forwards}
.boot.go .boot-hud .h4{animation:boot-spin 1.4s linear infinite}
@keyframes boot-spin{to{transform:rotate(360deg)}}
@keyframes boot-spin-r{to{transform:rotate(-360deg)}}
@keyframes boot-dash{to{stroke-dashoffset:0}}
.boot.ready .boot-hud .h2{stroke:var(--ba)}
.boot.ready .boot-ring{animation:boot-pulse .45s ease-out}
@keyframes boot-pulse{40%{transform:scale(1.05)}100%{transform:none}}

/* 288 px box = the Android 12+ splash icon size, so the hand-over from the system splash does not jump */
.boot-logo{position:absolute;left:50%;top:50%;width:288px;height:288px;margin:-144px 0 0 -144px;overflow:visible;transform-origin:50% 50%;opacity:0}
.boot-logo .fill{fill:#EDEDED}
.boot-logo .edge{fill:none;stroke:var(--bc);stroke-width:1;stroke-linejoin:round;stroke-dasharray:100;stroke-dashoffset:100;opacity:0}
.boot.go .boot-logo,.boot.calm .boot-logo{opacity:1}
.boot.go .boot-logo{transform:scale(var(--ls,.62));transition:transform .75s cubic-bezier(.2,.8,.2,1) .05s,opacity .3s ease}
.boot.go .boot-logo .edge{animation:boot-draw .9s ease-out .25s forwards}
@keyframes boot-draw{0%{opacity:1}100%{opacity:1;stroke-dashoffset:0}}

/* name, sub-title, boot log, progress */
.boot-info{position:absolute;left:50%;top:calc(50% + var(--hud) / 2 + 14px);width:min(80vw,320px);transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center}
.boot-name{font-size:25px;font-weight:500;letter-spacing:.46em;padding-left:.46em;color:#F3F8FB;white-space:nowrap;opacity:0;
  text-shadow:0 0 14px rgba(73,217,255,.55)}
.boot-name span{display:inline-block;width:1ch;text-align:center}
.boot.go .boot-name{opacity:1;transition:opacity .2s ease .15s}
.boot.ready .boot-name{text-shadow:0 0 16px rgba(255,138,91,.6)}
.boot-sub{margin-top:4px;font-size:9.5px;letter-spacing:.34em;padding-left:.34em;color:var(--bm);white-space:nowrap;opacity:0}
.boot.go .boot-sub{animation:boot-fade .5s ease .55s forwards}
.boot-log{margin-top:16px;width:100%;min-height:8.75em;font-size:10.5px;line-height:1.75;color:#93A8B8}
.boot-ln{display:flex;gap:8px;white-space:nowrap;animation:boot-in .22s ease-out both}
@keyframes boot-in{from{opacity:0;transform:translateX(-6px)}}
.boot-ln .k{flex:none;width:4.4em;color:var(--bc)}
.boot-ln .v{flex:1;min-width:0;overflow:hidden}
.boot-ln .v::after{content:' ................................................................';color:rgba(147,168,184,.32)}
.boot-ln b{flex:none;font-weight:500;color:var(--ok)}
.boot-ln b.boot-hot{color:var(--ba)}
.boot-bar{margin-top:10px;width:100%;height:2px;border-radius:2px;overflow:hidden;background:rgba(73,217,255,.14)}
.boot-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--bc),var(--ba));transform:scaleX(0);transform-origin:0 50%;box-shadow:0 0 10px var(--bc)}
.boot-foot{margin-top:7px;width:100%;display:flex;justify-content:space-between;font-size:9.5px;letter-spacing:.2em;color:var(--bm)}
.boot-foot b{font-weight:500;color:#DCE7EF;font-variant-numeric:tabular-nums}
.boot.ready .boot-foot span{color:var(--ba)}
.boot-skip{position:absolute;left:0;right:0;bottom:calc(22px + env(safe-area-inset-bottom,0px));text-align:center;font-size:9.5px;letter-spacing:.3em;color:rgba(220,231,239,.3);opacity:0}
.boot.go .boot-skip{animation:boot-fade .5s ease .9s forwards}

/* hand-over: the HUD zooms past the viewer while the layer fades into the app */
.boot.out{opacity:0;pointer-events:none;transition:opacity .42s ease .06s}
.boot.out .boot-ring{transform:scale(1.7);transition:transform .5s cubic-bezier(.5,0,.2,1)}
.boot.out .boot-logo{transform:scale(calc(var(--ls,.62) * 2.3));transition:transform .5s cubic-bezier(.5,0,.2,1)}
.boot.out .boot-info{opacity:0;transform:translate(-50%,10px);transition:opacity .25s ease,transform .3s ease}
.boot.out.skip{transition-duration:.22s;transition-delay:0s}
.boot.calm.out .boot-logo,.boot.calm.out .boot-ring{transform:none}
/* short screens (old 16:9 phones): a smaller HUD and tighter log so everything fits; the skip hint steps aside */
@media (max-height:700px){.boot{--hud:min(66vw,270px,30vh)}.boot-info{top:calc(50% + var(--hud) / 2 + 8px)}
  .boot-log{margin-top:12px;line-height:1.6;min-height:8em}.boot-skip{display:none}}

/* learn.css : check questions, new words and "Gehrai mein jao" under an answer (change 1.2).
   Techy look: mono labels, thin rules, letter keys, clear right/wrong states. */
.lcheck{margin-top:10px;padding:0;border:1px solid var(--line2);background:var(--paper)}
.lcheck .lc-h{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:11.5px;letter-spacing:.06em}
.lcheck .lc-k{color:var(--accent);font-weight:500}
.lcheck .lc-c{color:var(--fg);text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.lcheck .lc-tag{border:1px solid var(--warn);color:var(--warn);border-radius:6px;padding:1px 6px;font-size:10px}
.lcheck .sp{flex:1}
.lcheck .lc-s{color:var(--muted);font-variant-numeric:tabular-nums}
.lcheck .lc-item{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}

.lcheck .lc-item.bad{box-shadow:inset 3px 0 0 var(--bad)}

.lcheck .lc-opts{display:flex;flex-direction:column;gap:6px}
.lcheck .lc-opt{display:flex;gap:10px;align-items:center;text-align:left;width:100%;padding:10px 12px;border-radius:12px;background:var(--card);border:1.5px solid transparent;color:var(--fg);font:inherit;font-size:14px}
.lcheck .lc-opt:not([disabled]):active{border-color:var(--sel)}
.lcheck .lc-l{flex:none;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-family:var(--mono);font-size:12px;background:var(--card2);color:var(--fg2)}
.lcheck .lc-opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--card))}

.lcheck .lc-opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--card))}
.lcheck .lc-opt.wrong .lc-l{background:var(--bad);color:#fff}

.lcheck .lc-fill{display:flex;gap:8px}
.lcheck .lc-in{flex:1;min-width:0;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line2);background:var(--card);color:var(--fg);font-family:var(--mono);font-size:14px}
.lcheck .lc-in:focus{outline:none;border-color:var(--sel)}
.lcheck .lc-go{flex:none;padding:0 16px}
.lcheck .lc-skip{align-self:flex-start;font-size:12.5px}
.lcheck .lc-res{display:flex;flex-wrap:wrap;gap:6px 16px;font-family:var(--mono);font-size:12.5px;color:var(--fg2)}
.lcheck .lc-res b{color:var(--fg);font-weight:500}
.lcheck .lc-why{font-size:13.5px;color:var(--fg2);line-height:1.45}
.lcheck .lc-item.ok .lc-why b{color:var(--good)}
.lcheck .lc-item.bad .lc-why b{color:var(--bad)}
.lcheck .lc-f{padding:9px 14px;font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.03em}
.lwords{display:flex;align-items:center;gap:8px;margin-top:10px;width:100%;padding:9px 12px;border-radius:12px;border:1px dashed var(--line2);background:transparent;color:var(--fg2);text-align:left;font:inherit;font-size:13px}
.lwords .lw-k{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--accent);flex:none}
.lwords .lw-t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg)}
.lwords .lw-s{font-family:var(--mono);font-size:10.5px;color:var(--good);flex:none}

<script>
'use strict';
/* 00-android-bridge.js : only active inside the Android app (window.AdarshNative is injected by the WebView).
   In a normal browser this file does nothing, so the same build still works with the HTTP backend or the demo.
   Messages go straight to the embedded Python engine: no localhost server. */
(function () {
  const N = window.AdarshNative;
  if (!N) return;

  const pending = {};
  let seq = 0;

  /* called by Kotlin when the engine finished: (id, jsonString) or (id, null, errorString) */
  window.__adarshResult = function (id, json, err) {
    const p = pending[id]; if (!p) return;
    delete pending[id];
    if (err) return p.rej(new Error(err));
    try { p.res(JSON.parse(json)); } catch (e) { p.rej(new Error('The engine returned something unreadable.')); }
  };
  window.__adarshProgress = function (id, text) {
    const p = pending[id]; if (p && p.onProgress && text) p.onProgress(text);
  };

  /* Voice typing: Android's SpeechRecognizer behind the same interface STT uses for platform dictation
     (onPartial / onFinal / onState / start / stop). The WebView itself has no Web Speech API. */
  if (N.speechStart) {
    const L = { partial: [], final: [], state: [] };
    let startWait = null;
    const on = (k, f) => { L[k].push(f); return () => { L[k] = L[k].filter(x => x !== f); }; };
    window.__adarshSpeech = function (type, text) {
      if (type === 'started') { if (startWait) { startWait.res(); startWait = null; } return; }
      if (type === 'error') { if (startWait) { startWait.rej({ code: text }); startWait = null; } else L.state.forEach(f => f({ state: 'idle', reason: 'error', message: text })); return; }
      if (startWait) { startWait.res(); startWait = null; }
      if (type === 'partial') L.partial.forEach(f => f({ text }));
      else if (type === 'final') L.final.forEach(f => f({ text }));
      else if (type === 'processing') L.state.forEach(f => f({ state: 'processing', reason: 'processing' }));
      else if (type === 'state') L.state.forEach(f => f({ state: 'idle', reason: text }));
    };
    window.__adarshDictation = {
      onPartial: (f) => on('partial', f), onFinal: (f) => on('final', f), onState: (f) => on('state', f),
      start: () => new Promise((res, rej) => {
        startWait = { res, rej };
        setTimeout(() => { if (startWait) { startWait.rej({ code: 'timeout' }); startWait = null; } }, 15000);  // permission dialog counts
        try { N.speechStart((typeof S !== 'undefined' && S.settings && S.settings.lang) || 'en-IN', !!(typeof S !== 'undefined' && S.settings && S.settings.bnr), (typeof S !== 'undefined' && S.settings && S.settings.bnrFunctionId) || ''); } catch (e) { startWait = null; rej({ code: 'unavailable' }); }
      }),
      stop: () => { try { N.speechStop(); } catch (e) {} return Promise.resolve(); }
    };
  }

  /* short engine jobs (natural voice): no foreground-service notification */
  const quiet = (req, ms) => new Promise((res, rej) => {
    const id = 'q' + (++seq) + '_' + Date.now();
    pending[id] = { res, rej };
    const t = setTimeout(() => { if (pending[id]) { delete pending[id]; try { N.cancel(id); } catch (e) {} rej(new Error('timeout')); } }, ms || 30000);
    const done = pending[id];
    pending[id] = { res: (v) => { clearTimeout(t); done.res(v); }, rej: (e) => { clearTimeout(t); done.rej(e); } };
    try { (N.sendQuiet || N.send).call(N, id, JSON.stringify(req)); } catch (e) { clearTimeout(t); delete pending[id]; rej(e); }
  });
  const nativeJob = (method, ...args) => new Promise((res, rej) => {
    const id = 'c' + (++seq) + '_' + Date.now();
    const t = setTimeout(() => { if (pending[id]) { delete pending[id]; rej(new Error('Controller request timeout')); } }, 20000);
    pending[id] = { res: v => { clearTimeout(t); res(v); }, rej: e => { clearTimeout(t); rej(e); } };
    try { N[method](id, ...args); } catch (e) { clearTimeout(t); delete pending[id]; rej(new Error('Controller bridge unavailable')); }
  });
  window.ADARSH_BACKEND = {
    native: true,
    /* {type:'audio', file} | {type:'error', error} */
    tts(req, ms) { return quiet({ tts: req }, ms); },
    /* API usage screen: local counters only, no model call, no foreground service */
    usage() { return quiet({ usage: true }, 15000); },
    controllerStatus() { try { return JSON.parse(N.controllerStatus()); } catch (e) { return { linked: false, revision: 0 }; } },
    controllerPair(code) { return nativeJob('controllerPair', code); },
    controllerSync() { return nativeJob('controllerSync'); },
    status() { try { return JSON.parse(N.status()); } catch (e) { return { ready: false }; } },
    send(req, o) {
