const BackgroundVoice = (() => {
  let state = { active: false, state: 'stopped' }, redraw = null, syncing = false, handedOff = false, notifHint = false, lastError = '';
  const N = () => window.AdarshNative;
  const supported = () => !!(N() && N().backgroundVoiceStart);
  const active = () => !!state.active || ['starting', 'permission_required'].includes(state.state);
  /* States in which the user is not mid-sentence and no reply is being prepared or spoken. */
  const QUIET = ['starting', 'listening', 'retrying'];
  function apply(value) {
    if (!value || typeof value !== 'object') return state;
    if (value.type === 'reply') return state;
    state = { ...value, message: value.message || value.error || '', state: value.state || (value.ok === false ? 'error' : value.active ? 'listening' : 'stopped') };
    if (state.state === 'error' && (value.error || value.message)) lastError = String(value.error || value.message);   // kept: the phone forgets it once the session ends
    if (redraw) redraw();
    Bus.emit('background:state', state);
    if (handedOff && !document.hidden) setTimeout(maybeResume, 0);
    return state;
  }
  function call(method, ...args) {
    try { return apply(JSON.parse(N()[method](...args))); }
    catch (e) { return apply({ active: false, state: 'error', message: 'Background voice nahi chala. App dobara kholo aur permissions check karo.' }); }
  }
  function configFor(c) {
    const access = Productivity.access();
    return {
      chatId: c ? c.id : uid('c'), mode: Modes.current().id, source: S.settings.source || 'auto', lang: S.settings.lang,
      access, history: c && access.currentChat ? Chat.history(c) : [],
      reply: { lang: S.settings.replyLang || 'auto', depth: S.settings.depth || 'normal', think: S.settings.think || 'fast', web: S.settings.webSearch === false ? 'off' : 'on', ...(S.philosophy ? { philosophy: String(S.philosophy).slice(0, 3000) } : {}) },
      voice: { engine: S.settings.voiceEngine || 'auto', name: S.settings.voiceName || 'Orus', deviceVoice: S.settings.deviceVoice || '', rate: S.settings.rate || 1 }
    };
  }
  function start() {
    if (!supported() || !Backend.isNative()) return toast('Outside-app voice ke liye embedded Android engine chahiye.');
    if (active()) return toast('Background voice is already starting or active. Stop it first.');
    if (!$('#lock').hidden) return toast('Pehle app unlock karo.');
    if (Chat.isBusy()) return toast('Current answer complete hone do.');
    if ((S.settings.source || 'auto') !== 'auto') return toast('Background voice ke liye Auto source chahiye.');
    const config = configFor(Chat.cur() || Chat.newChat());
    Voice.close(); STT.stop(); TTS.stop();
    const out = call('backgroundVoiceStart', JSON.stringify(config));
    if (!out.ok && out.message) toast(out.message);
    return out;
  }
  /* Live voice (any mode) keeps going after Back/Home/screen off: while the voice screen is open the phone holds a
     ready config, and the app starts the 30-minute background session at the moment it leaves the screen. */
  /* Any selected mode can continue outside the app (the session keeps that mode; phone actions stay Standard-only). */
  const canHandoff = () => supported() && !!N().backgroundVoiceArm && Backend.isNative() &&
    (S.settings.source || 'auto') === 'auto' && $('#lock').hidden && !active();
  function arm() {
    if (!canHandoff()) return disarm();
    try {
      const r = JSON.parse(N().backgroundVoiceArm(JSON.stringify(configFor(Chat.cur()))));
      if (r && r.armed && r.notifications === false && !notifHint) { notifHint = true; toast('App se bahar voice chalne ke liye notifications allow karo.'); }
    } catch (e) {}
  }
  function disarm() { try { if (N() && N().backgroundVoiceArm) N().backgroundVoiceArm(''); } catch (e) {} }
  /* Native started the session while the app was leaving: close the in-app screen without touching the session. */
  window.__adarshVoiceHandoff = value => {
    if (value && value.ok) { handedOff = true; lastError = ''; Voice.close({ keepBackground: true }); }
    else if (value && (value.error || value.message)) lastError = String(value.error || value.message);
    apply(value);
  };
  /* Back in the app: when the session is quiet, end it and continue the same conversation on the voice screen. */
  function maybeResume() {
    if (document.hidden || !$('#lock').hidden) return;
    if (lastError && !active()) { toast('Bahar voice ruk gayi: ' + lastError); lastError = ''; }
    if (!handedOff) return;
    if (active() && !QUIET.includes(state.state)) return;   // the user is speaking or a reply is on its way: wait for it
    handedOff = false;
    const wasActive = active();
    if (wasActive) call('backgroundVoiceStop');
    sync();
    if (wasActive) setTimeout(() => Voice.open({ listen: true }), 500);   // give the service a moment to release the mic
  }
  function stop(message) {
    if (!supported()) return;
    handedOff = false;
    const was = active(); const out = call('backgroundVoiceStop');
    if (was && message) toast(message);
    return out;
  }
  function sync() {
    if (!supported() || syncing || !$('#lock').hidden) return;
    syncing = true;
    try {
      const rows = JSON.parse(N().backgroundVoicePeek());
      if (!Array.isArray(rows) || !rows.length) return;
      const ids = Chat.importBackground(rows);
      if (ids.length && saveNow()) {
        const ack = JSON.parse(N().backgroundVoiceAck(JSON.stringify(ids)));
        if (ack.ok && rows.length > ids.length) setTimeout(sync, 0);
      }
      Productivity.sync(); Bus.emit('records:changed');
    } catch (e) { /* Inbox is not acknowledged until UI persistence succeeds. */ }
    finally { syncing = false; }
  }
  function open() {
    if (!supported()) return toast('Background live voice Android APK mein available hai.');
    call('backgroundVoiceStatus');
    const close = sheet({ title: 'Background live voice', tall: true, build(b) {
      const draw = () => {
        b.textContent = '';
        b.append(h('p', {}, 'App ke bahar live · notification mein Stop'), h('p', { role: 'status', 'aria-live': 'polite' }, String(state.message || state.state || 'Stopped')),
          h('p', {}, 'Session mode: ' + (state.mode || Modes.current().name)));
        if (active()) b.append(h('button', { class: 'btn pri', on: { click: () => { close(); handedOff = false; call('backgroundVoiceStop'); sync(); setTimeout(() => Voice.open({ listen: true }), 500); } } }, 'App mein baat jaari rakho'),
          h('button', { class: 'btn ghost', on: { click: () => stop() } }, 'Stop background voice'));
        b.append(h('p', { class: 'muted' }, 'Back/Home par apne aap · max 30 min · Auto source'),
          h('p', { class: 'muted' }, 'Notes, tasks aur memory attach nahi hote.'),
          h('p', { class: 'muted' }, 'Recognition online ho sakta hai · recording save nahi hoti.'),
          h('button', { class: 'btn ghost', on: { click: () => close() } }, 'Close controls'));
      };
      redraw = draw; draw();
      const observer = new MutationObserver(() => { if (!b.isConnected) { observer.disconnect(); if (redraw === draw) redraw = null; } });
      observer.observe($('#phone'), { childList: true });
    } });
  }
  window.__adarshBackgroundVoice = value => { apply(value); if (!document.hidden) sync(); };
  function init() {
    if (!supported()) return;
    call('backgroundVoiceStatus'); sync();
    document.addEventListener('visibilitychange', () => { if (!document.hidden) { call('backgroundVoiceStatus'); sync(); maybeResume(); } });
    Bus.on('mode:changed', () => { if (active()) stop('Mode changed. Restart background voice in the selected mode.'); if (Voice.isOpen) arm(); });
    Bus.on('lock:unlocked', sync);
  }
  return { init, open, start, stop, sync, arm, disarm, active, supported, status: () => state };
})();

'use strict';
/* 07-splash.js : the startup animation (dark "tech HUD") over the app while it boots.
   The #boot layer is static markup in index.html (styles in css/boot.css), so it is the first paint and the chat
   never flashes before it. This module runs the timed part: the name decodes letter by letter, a short boot log
   that reflects the real settings (mode, Wikipedia / web search, key storage), a progress bar and a clock, then the
   HUD zooms into the app. About 3.5 s in total; a tap skips it.
   S.settings.bootAnim=false (AI command) turns it off (the layer is then removed before it is seen).
   prefers-reduced-motion gets a short fade only. If anything here fails, the layer is removed at once, and CSS
   hides it after a few seconds even if this script never runs. On Android the system bars go dark with it
   (AdarshNative.bootBars); MainActivity also turns them back on its own after 9 s or a load error. */
const Splash = (() => {
  const GLYPHS = 'ABCDEFGHJKLMNPQRSTUVWXYZ0123456789#$%&*+<>/=';
  const NAME = 'ADARSH';
  // ms after the HUD starts: name letters lock, log lines appear, progress fills, ready, hand-over
  const T = { nameLock: 330, letterGap: 85, firstLine: 420, lineGap: 210, status: 150, ready: 2700, out: 3000, fade: 460, skipFade: 240 };
  const A_HEIGHT = 138.7;   // px height of the "A" in the 288 px logo box (52 of 108 viewport units)
  let el = null, tpl = null, t0 = 0, done = true, readyShown = false, timers = [], lastScramble = 0;
  let nameSpans = [], lineEls = [], lines = [], fill = null, pct = null, state = null, clock = null;

  const later = (fn, ms) => { timers.push(setTimeout(fn, ms)); };
  /* Android: the status and navigation bars take the dark ground while the layer is up (a cold start begins dark) */
  function bars(dark) { try { if (window.AdarshNative && AdarshNative.bootBars) AdarshNative.bootBars(!!dark); } catch (e) {} }
  /* requestAnimationFrame, but never re-entrant (a synchronous rAF, e.g. in tests, falls back to a timer) */
  function frame(fn) {
    let sync = true;
    requestAnimationFrame(ts => { if (sync) setTimeout(() => fn(performance.now()), 16); else fn(ts); });
    sync = false;
  }
  function bootLines() {
    const mode = String(S.settings.mode || 'standard').toUpperCase();
    const web = S.settings.webSearch !== false;
    const native = !!window.AdarshNative;
    return [
      ['INIT', 'adarsh core', 'OK', ''],
      ['LOAD', 'chats · memory · notes', 'OK', ''],
      ['MODE', mode, 'SET', ''],
      ['NET', web ? 'wikipedia + web search' : 'wikipedia research', 'ON', ''],
      ['SRC', S.settings.research === false ? 'research sources off' : 'arxiv · nasa · world bank', S.settings.research === false ? 'OFF' : 'LINK', ''],
      ['SEC', native ? 'keystore · encrypted keys' : 'local storage', native ? 'SECURE' : 'LOCAL', 'boot-hot'],
    ];
  }
  function scramble() { return GLYPHS[Math.floor(Math.random() * GLYPHS.length)]; }
  function hhmmss() { const d = new Date(); return [d.getHours(), d.getMinutes(), d.getSeconds()].map(n => String(n).padStart(2, '0')).join(':'); }

  function tick(now) {
    if (done || !el) return;
    const t = now - t0;
    // name: random glyphs that lock into A-D-A-R-S-H from left to right
    const reshuffle = now - lastScramble > 45;
    if (reshuffle) lastScramble = now;
    nameSpans.forEach((sp, i) => {
      if (t >= T.nameLock + i * T.letterGap) { if (sp.textContent !== NAME[i]) sp.textContent = NAME[i]; }
      else if (reshuffle) sp.textContent = scramble();
    });
    // boot log: each line types in, then shows its status
    lines.forEach((ln, k) => {
      const at = T.firstLine + k * T.lineGap;
      if (t < at) return;
      if (!lineEls[k]) {
        const v = h('span', { class: 'v' }), b = h('b', { class: ln[3] });
        lineEls[k] = { v, b, row: h('div', { class: 'boot-ln' }, h('span', { class: 'k' }, ln[0]), v, b) };
        $('#boot-log', el).append(lineEls[k].row);
      }
      const r = lineEls[k], typed = Math.min(ln[1].length, Math.ceil((t - at) / 9));
      if (r.v.textContent.length !== typed) r.v.textContent = ln[1].slice(0, typed);
      if (t >= at + T.status && !r.b.textContent) r.b.textContent = ln[2];
    });
    const p = Math.min(1, t / T.ready), eased = 1 - Math.pow(1 - p, 2.2);
    fill.style.transform = 'scaleX(' + eased.toFixed(3) + ')';
    pct.textContent = Math.round(eased * 100) + '%';
    if (t > T.firstLine && !readyShown) state.textContent = 'LINKING';
    const c = hhmmss(); if (clock.textContent !== c) clock.textContent = c;
    if (t >= T.ready && !readyShown) {
      readyShown = true;
      el.classList.add('ready');
      state.textContent = 'SYSTEM READY';
      vibe(14);   // Settings > Haptics decides
    }
    if (t >= T.out) return out(false);
    frame(tick);
  }

  function begin() {
    if (!el) return;
    const ring = $('.boot-ring', el), hud = ring ? ring.offsetWidth : 0;
    el.style.setProperty('--ls', hud ? (hud * 0.34 / A_HEIGHT).toFixed(3) : '0.62');
    nameSpans = [...NAME].map(() => h('span', {}, scramble()));
    const nm = $('#boot-name', el); nm.textContent = ''; nm.append(...nameSpans);
    lines = bootLines(); lineEls = [];
    fill = $('#boot-fill', el); pct = $('#boot-pct', el); state = $('#boot-state', el); clock = $('#boot-clock', el);
    clock.textContent = hhmmss();
    el.classList.add('go');
    t0 = performance.now(); lastScramble = 0;
    frame(tick);
    later(() => out(false), T.out + 900);   // a WebView that pauses rAF can not keep the layer up
  }

  function out(skipped) {
    if (done || !el) return;
    done = true;
    el.classList.add('out');
    if (skipped) el.classList.add('skip');
    later(() => bars(false), skipped ? 60 : 180);   // mid-fade, as the app shows through
    const node = el;
    later(() => remove(node), skipped ? T.skipFade : T.fade);
  }
  function skip(e) { if (e) { e.preventDefault(); e.stopPropagation(); } out(true); }
  function remove(node) {
    const n = node || el;
    if (n && n === el) { timers.forEach(clearTimeout); timers = []; el = null; done = true; bars(false); }
    if (n && n.parentNode) n.remove();
  }

  /* app start: called by 08-boot.js right after the saved settings are loaded */
  function start(opts = {}) {
    el = document.getElementById('boot');
    if (!el) return false;
    if (!tpl) tpl = el.cloneNode(true);
    try {
      if (!opts.force && (S.settings.bootAnim === false || document.hidden)) { remove(); return false; }
      done = false; readyShown = false;
      bars(true);
      el.addEventListener('pointerdown', skip);
      el.addEventListener('click', skip);
      const calm = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
      if (calm) { el.classList.add('calm'); later(() => out(false), 450); return true; }
      // two frames: the dark first paint is on screen before the HUD (and the "A") starts
      frame(() => frame(begin));
      return true;
    } catch (e) { remove(); return false; }
  }
  /* Settings preview: play it again now */
  function replay() {
    if (el || !tpl) return false;
    const node = tpl.cloneNode(true);
    document.body.append(node);
    void node.offsetWidth;   // apply the static state first so the HUD animates from it
    return start({ force: true });
  }
  return { start, replay, skip: () => out(true), active: () => !!el && !done };
})();

'use strict';
/* 08-boot.js : start-up + public UI hooks */
(function boot() {
  load();
  Splash.start();   // startup animation over the boot (S.settings.bootAnim, AI command se)
  Productivity.init();
  App.applyTheme();
  App.buildDrawer();
  Chat.mount($('#v-chat'));
  App.drawerList();

  window.ADARSH_UI = {
    push: (r, o) => Chat.push(r, o), banner, toast, send: (t) => App.ask(t), open: (v) => App.show(v),
    on: Bus.on, version: 4
  };

  Backend.refresh();
  document.addEventListener('visibilitychange', () => { if (!document.hidden) Backend.refresh(); });
  document.addEventListener('click', hapticTap, true);   // Settings > Haptics: small vibration on every tap
  if (window.__adarshDictation) STT.dict = window.__adarshDictation;
  try { if (window.claude && claude.use) claude.use('dictation').then(d => { STT.dict = d || STT.dict || null; }).catch(() => {}); } catch (e) {}
  if (S.lock) Lock.lockNow();
  MobileUpdates.init();
  try { Briefing.init(); } catch (e) { console.warn('briefing init', e); }   /* change 1.3 */
  try { News.init(); } catch (e) { console.warn('news init', e); }   /* change 1.5 */
  BackgroundVoice.init();
})();

</script>
