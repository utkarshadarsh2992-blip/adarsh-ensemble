      }
      return out;
    }
    function script() { eat(); return atom(false); }
    function group(raw) { eat(); return atom(raw); }  /* one {group} or one token */
    function rawText() { eat(); if (src[i] === '{') { i++; const g = seq('}', true); i++; return g; } return atom(true); }

    function atom(raw) {
      const c = src[i];
      if (c === undefined) return [];
      if (c === '{') { i++; const g = seq('}', raw); i++; return g; }
      if (c === '\\') return command(raw);
      i++;
      if (raw) return [c];
      if (c === ' ' || c === '\n' || c === '\t' || c === '}') return [];
      if (/[A-Za-z]/.test(c)) return [h('i', {}, c)];
      if (c === '-') return [h('span', { class: 'op' }, '−')];
      if (c === '=' || c === '+' || c === '<' || c === '>') return [h('span', { class: 'op' }, c)];
      if (c === '*') return ['∗'];
      if (c === ',' || c === ';') return [c + ' '];
      if (c === '&' || c === '~') return [' '];
      if (c === "'") return ['′'];
      return [c];
    }

    function command(raw) {
      i++;                                           /* the backslash */
      let name = '';
      if (/[A-Za-z]/.test(src[i] || '')) { while (/[A-Za-z]/.test(src[i] || '')) name += src[i++]; }
      else { name = src[i] || ''; i++; }
      if (name === '\\') return [h('br')];
      if ('{}%&_#$|'.includes(name) && name) return [name === '|' ? '‖' : name];
      if (name in SPACE) return [SPACE[name]];
      if (name === 'frac' || name === 'dfrac' || name === 'tfrac') {
        const a = group(raw), b = group(raw);
        return [h('span', { class: 'frac' }, h('span', { class: 'n' }, a), h('span', { class: 'd' }, b))];
      }
      if (name === 'sqrt') {
        let idx = null;
        if (src[i] === '[') { const k = src.indexOf(']', i); if (k > 0) { idx = src.slice(i + 1, k); i = k + 1; } }
        return [h('span', { class: 'sqrt' }, idx ? h('sup', { class: 'ri' }, idx) : null, '√', h('span', { class: 'rad' }, group(raw)))];
      }
      if (name === 'mathbb') { const t = rawText().join(''); return [BB[t] || t]; }
      if (TEXTCMD.has(name)) return [h('span', { class: 'rm' }, rawText())];
      if (BOLDCMD.has(name)) return [h('b', { class: 'rm' }, rawText())];
      if (name in ACC) {
        const a = group(raw), last = a[a.length - 1];
        if (a.length === 1 && last && last.nodeType === 1 && last.tagName === 'I' && last.textContent.length === 1) { last.textContent += ACC[name]; return a; }
        if (a.length === 1 && typeof last === 'string' && last.length === 1) return [last + ACC[name]];
        return [h('span', { class: 'ov' }, a)];
      }
      if (SIZECMD.has(name)) { eat(); if (src[i] === '.') { i++; return []; } return atom(raw); }
      if (name === 'begin' || name === 'end') { rawText(); return []; }
      if (name === 'limits' || name === 'nolimits' || name === 'displaystyle' || name === 'textstyle' || name === 'scriptstyle') return [];
      if (name in GREEK_LOWER) return [h('i', {}, GREEK_LOWER[name])];
      if (name in REL) return [h('span', { class: 'op' }, REL[name])];
      if (name in BIG) return [h('span', { class: 'big' }, BIG[name])];
      if (name in SYM) return [SYM[name]];
      if (FN.has(name)) return [h('span', { class: 'rm fn' }, name)];
      return [h('span', { class: 'rm' }, name)];     /* unknown command: show its name rather than a stray backslash */
    }
    return seq(undefined, false);
  }

  const nodes = (src) => { try { return parse(String(src == null ? '' : src)); } catch (e) { return [String(src)]; } };
  return {
    nodes,
    span: (src) => h('span', { class: 'math' }, nodes(src)),
    block: (src) => h('div', { class: 'mathblock' }, nodes(src))
  };
})();

'use strict';
/* 02-render.js : reply-type renderers. One function per reply type.
   Contract: RENDER[type](data, ctx) -> Node.  ctx = { msg, redraw() }.  See ARCHITECTURE.md for each shape. */

const VERDICT = {
  SUPPORTED_BY_MULTIPLE_SOURCES: ['good', 'Multiple sources'], SUPPORTED_BY_ONE_SOURCE: ['info', 'One source'],
  PARTIALLY_SUPPORTED: ['warn', 'Partial'], CONTESTED: ['warn', 'Contested'], UNVERIFIED_NO_JUDGE: ['mute', 'Unverified'],
  CONTRADICTED_BY_SOURCE: ['bad', 'Contradicted'], UNSUPPORTED_NO_VALID_EVIDENCE: ['bad', 'No evidence'], UNSUPPORTED_UNRELATED: ['bad', 'Unrelated']
};
const pill = (v) => { const [c, l] = VERDICT[v] || ['mute', String(v || '').replace(/_/g, ' ').toLowerCase() || '—']; return h('span', { class: 'pill ' + c }, l); };
const head = (kind, title, extra) => h('div', { class: 'card-h' }, h('div', { class: 'grow' }, h('span', { class: 'k' }, kind), title ? h('h3', {}, title) : null), extra);
const sec = (k, ...c) => h('div', { class: 'sec' }, k ? h('span', { class: 'k' }, k) : null, ...c);
const hostOf = (u) => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return u || ''; } };

/* reply.notes = { title, items: [{ title, text }] }: folded under the reply (falsifier findings). */
const notesEl = (n) => h('details', { class: 'notes' },
  h('summary', {}, icon('warn', 's'), (n.title || 'Notes') + ' · ' + n.items.length, h('span', { style: 'flex:1' }), icon('chev', 'chev')),
  n.items.map(it => h('div', { class: 'note-item' }, it.title ? h('b', {}, it.title) : null, md(it.text || ''))));

const RENDER = {
  text: (d) => md(d.text),

  research: (d) => {
    const card = h('div', { class: 'card' });
    card.append(head('Research', d.question, d.confidence != null ? h('span', { class: 'chip' }, Math.round(d.confidence * 100) + '% confidence') : null));
    if (d.summary) card.append(sec('Answer', md(d.summary)));
    (d.claims || []).forEach((c, i) => {
      card.append(h('details', { class: 'claim' },
        h('summary', {}, h('span', { class: 'n' }, String(i + 1)), h('span', { class: 'ct' }, c.text), icon('chev', 'chev'), pill(c.verdict)),
        h('div', { class: 'checks' }, (c.checks || []).map(k => h('div', { class: 'check' }, h('b', {}, k.source), pill(k.verdict), k.note ? h('span', {}, k.note) : null)))));
    });
    if (d.sources && d.sources.length) card.append(h('details', { class: 'fold' }, h('summary', {}, icon('link', 's'), 'Sources (' + d.sources.length + ')', h('span', { style: 'flex:1' }), icon('chev', 'chev')),
      h('div', { class: 'in' }, d.sources.map(s => h('div', { class: 'src' }, h('b', {}, '[' + s.n + ']'), s.url ? h('a', { href: s.url, target: '_blank', rel: 'noopener noreferrer', style: 'color:var(--fg)' }, s.title || hostOf(s.url)) : (s.title || ''), s.url ? h('small', {}, hostOf(s.url)) : null)))));
    if (d.caveat) card.append(sec('', h('div', { class: 'note' }, icon('warn', 's'), d.caveat)));
    return card;
  },

  debate: (d) => {
    const side = (name, tag, text) => h('div', {}, h('div', { class: 'who' }, name, h('span', {}, tag)), md(text));
    return h('div', { class: 'card duo' },
      head('Debate', d.topic), side('For', 'debater_pro', d.pro), side('Against', 'debater_con', d.con),
      h('div', { class: 'verdict' }, side('Moderator', 'verdict', d.verdict)));
  },

  patterns: (d) => {
    const card = h('div', { class: 'card' }, head('Patterns', d.title || 'Patterns found'));
    (d.patterns || []).forEach(p => card.append(h('div', { class: 'pat' },
      h('div', { class: 'head' }, h('p', {}, p.claim), p.strength ? h('span', { class: 'pill ' + (p.strength === 'strong' ? 'good' : p.strength === 'weak' ? 'mute' : 'info') }, p.strength) : null),
      p.evidence ? h('ul', {}, p.evidence.map((e, i) => h('li', {}, h('b', {}, 'E' + (i + 1)), e))) : null,
      p.so_what ? h('div', { class: 'meta' }, h('b', {}, 'So what: '), p.so_what) : null)));
    return card;
  },

  links: (d) => {
    const card = h('div', { class: 'card' }, head('Connections', d.title || 'Connections'));
    (d.chains || []).forEach(c => card.append(h('div', { class: 'pat' },
      h('div', { class: 'chain' }, c.nodes.flatMap((n, i) => i ? [h('em', {}, '→'), n] : [n])), c.why ? h('div', { class: 'meta' }, c.why) : null)));
    return card;
  },

  mission: (d, ctx) => {
    const st = d.stages || []; const done = st.filter(s => s.status === 'completed').length;
    const card = h('div', { class: 'card' }, head('Mission', d.title, h('span', { class: 'pill ' + (d.status === 'completed' ? 'good' : d.status === 'failed' ? 'bad' : 'info') }, d.status || 'running')),
      sec('', h('div', { class: 'muted' }, done + ' of ' + st.length + ' stages'), h('div', { class: 'bar' }, h('i', { style: 'width:' + (st.length ? done / st.length * 100 : 0) + '%' }))));
    st.forEach(s => card.append(h('div', { class: 'stage ' + (s.status || 'pending') },
      h('span', { class: 'st' }, s.status === 'completed' ? icon('check') : s.status === 'failed' ? icon('x') : null), h('span', { class: 'lbl' }, s.label), h('span', { class: 's' }, s.status || 'pending'))));
    if (d.status !== 'completed' && d.status !== 'cancelled') card.append(h('div', { class: 'card-btns' },
      h('button', { class: 'sbtn', on: { click: () => Bus.emit('mission:action', { id: d.id, action: d.status === 'paused' ? 'resume' : 'pause' }) } }, d.status === 'paused' ? 'Resume' : 'Pause'),
      h('button', { class: 'sbtn', on: { click: () => Bus.emit('mission:action', { id: d.id, action: 'cancel' }) } }, 'Cancel')));
    return card;
  },

  /* ---------- structured question from the AI ---------- */
  ask: (d, ctx) => {
    const qs = d.questions || [];
    const card = h('div', { class: 'card ask' });
    if (d.answered) {
      card.append(head('Question answered', null));
      d.answered.forEach(a => card.append(h('div', { class: 'kvr' }, h('b', {}, a.header || 'Q'), h('span', {}, a.answer || 'Skipped'))));
      return card;
    }
    const dr = d.draft = d.draft || { page: 0, sel: qs.map(() => []), other: qs.map(() => '') };
    const q = qs[dr.page]; const multi = !!q.multi; const last = dr.page === qs.length - 1;
    const hasAns = (i) => dr.sel[i].length > 0 || (dr.other[i] || '').trim();
    card.append(head('Adarsh needs your input', null, qs.length > 1 ? h('div', { class: 'pg', 'aria-label': 'Question ' + (dr.page + 1) + ' of ' + qs.length }, qs.map((_, i) => h('i', { class: i === dr.page ? 'on' : '' }))) : null));
    card.append(h('div', { class: 'q' }, q.header ? h('span', { class: 'hd' }, q.header) : null, h('p', { class: 'qt' }, q.question)));
    const opts = h('div', { class: 'opts', role: multi ? 'group' : 'radiogroup' });
    (q.options || []).forEach((o, oi) => {
      const on = dr.sel[dr.page].includes(oi);
      opts.append(h('button', { class: 'opt' + (on ? ' on' : ''), role: multi ? 'checkbox' : 'radio', 'aria-checked': String(on), on: {
        click: () => {
          const a = dr.sel[dr.page];
          if (multi) { const k = a.indexOf(oi); k >= 0 ? a.splice(k, 1) : a.push(oi); } else { dr.sel[dr.page] = [oi]; dr.other[dr.page] = ''; }
          vibe(); ctx.redraw();
        }
      } }, h('span', { class: 'mk' + (multi ? ' sq' : '') }, on ? icon('check') : null),
      h('span', { class: 'ot' }, h('b', {}, o.label), o.description ? h('small', {}, o.description) : null)));
    });
    if (q.allowOther !== false) {
      const inp = h('input', { type: 'text', placeholder: 'Something else…', value: dr.other[dr.page] || '', 'aria-label': 'Other answer', on: { input: () => { dr.other[dr.page] = inp.value; if (!multi && inp.value) dr.sel[dr.page] = []; foot.sub.disabled = !hasAns(dr.page); } } });
      opts.append(h('label', { class: 'opt other' }, h('span', { class: 'mk' + (multi ? ' sq' : '') }, icon('edit', 's')), inp));
    }
    card.append(opts);
    const sub = h('button', { class: 'btn pri', disabled: !hasAns(dr.page), on: { click: () => (last ? submit(false) : (dr.page++, ctx.redraw())) } }, last ? 'Submit' : 'Next');
    const foot = { sub };
    card.append(h('div', { class: 'ask-foot' },
      dr.page > 0 ? h('button', { class: 'link', on: { click: () => { dr.page--; ctx.redraw(); } } }, 'Back') : h('button', { class: 'link', on: { click: () => submit(true) } }, 'Skip'),
      h('span', { class: 'sp' }), sub));
    function submit(skip) {
      d.answered = skip ? qs.map(x => ({ header: x.header, question: x.question, answer: '' })) : qs.map((x, i) => ({
        header: x.header, question: x.question,
        answer: [...dr.sel[i].map(k => x.options[k].label), (dr.other[i] || '').trim()].filter(Boolean).join(', ')
      }));
      delete d.draft; save(); ctx.redraw(); Bus.emit('ask:answer', { msg: ctx.msg, askId: d.id, answers: d.answered, skipped: skip });
    }
    return card;
  },

  /* ---------- permission request ---------- */
  approve: (d, ctx) => {
    const risk = d.risk || 'medium';
    const card = h('div', { class: 'card approve' + (risk === 'high' ? ' risk-high' : '') },
      head('Permission needed', d.title, h('span', { class: 'pill ' + (risk === 'high' ? 'bad' : risk === 'low' ? 'good' : 'warn') }, risk + ' risk')));
    if (d.detail) card.append(sec('', h('p', {}, d.detail)));
    if (d.action) card.append(h('div', { class: 'kvr' }, h('b', {}, 'Action'), h('span', { class: 'mono', style: 'font-size:13px' }, d.action)));
    if (d.scope) card.append(h('div', { class: 'kvr' }, h('b', {}, 'Scope'), h('span', {}, d.scope)));
    if (d.decision) {
      card.append(h('div', { class: 'decided ' + d.decision }, icon(d.decision === 'allow' ? 'check' : 'x', 's'),
        d.decision === 'allow' ? 'Allowed' : d.decision === 'deny' ? 'Denied' : 'Expired'));
    } else {
      const go = (decision) => { d.decision = decision; save(); ctx.redraw(); Bus.emit('approve:decide', { msg: ctx.msg, id: d.id, decision, title: d.title }); };
      card.append(h('div', { class: 'card-btns' },
        h('button', { class: 'btn ghost', style: 'flex:1', on: { click: () => go('deny') } }, 'Deny'),
        h('button', { class: 'btn pri', style: 'flex:1', on: { click: () => go('allow') } }, 'Allow')));
    }
    return card;
  },

  memory: (d, ctx) => h('div', { class: 'chipcard' + (d.gone ? ' gone' : '') }, h('span', { class: 'ci' }, icon('brain', 's')),
    h('span', { class: 'ct' }, h('b', {}, d.gone ? 'Removed from memory' : 'Saved to memory'), h('span', {}, d.text)),
    d.gone ? null : h('button', { class: 'link', on: { click: () => { Bus.emit('memory:undo', { msg: ctx.msg }); ctx.redraw(); } } }, 'Undo')),

  task: (d, ctx) => { const f = fmtDue(d.due); return h('div', { class: 'chipcard' + (d.gone ? ' gone' : '') }, h('span', { class: 'ci' }, icon('tasks', 's')),
    h('span', { class: 'ct' }, h('b', {}, d.gone ? 'Task removed' : 'Task added'), h('span', {}, d.title + (f.t ? ' · ' + f.t : ''))),
    d.gone ? null : h('button', { class: 'link', on: { click: () => { Bus.emit('task:undo', { msg: ctx.msg }); ctx.redraw(); } } }, 'Undo')); }
};

/* unknown reply type: degrade to text rather than crash */
function renderReply(d, ctx) {
  try { return (RENDER[d.type] || RENDER.text)(RENDER[d.type] ? d : { text: d.text || JSON.stringify(d, null, 2) }, ctx); }
  catch (e) { console.error('render', d.type, e); return md('Could not display this reply (' + d.type + ').'); }
}

/* what the voice mode reads out loud for each reply type */
function speechOf(d) {
  switch (d.type) {
    case 'text': return stripMd(d.text);
    case 'research': return stripMd(d.summary || d.question);
    case 'debate': return stripMd(d.verdict);
    case 'ask': return (d.questions && d.questions[0] && d.questions[0].question) || 'I have a question.';
    case 'approve': return 'Permission needed. ' + (d.title || '') + '. Should I go ahead?';
    case 'memory': return 'Saved to memory.';
    case 'task': return 'Task added: ' + (d.title || '');
    case 'mission': return 'Mission ' + (d.title || '') + ' is ' + (d.status || 'running') + '.';
    default: return '';
  }
}

'use strict';
/* 03-council.js : "Kisne kya socha".
   1) the Thinking block in the chat (live lines while the engine works, "Thought for 38s" afterwards)
   2) the full page behind it: every role's prompt, model, answer, what was dropped, the audit, before/after.
   The data is reply.council (built by council.py). Without it (demo mode, quick replies) only the block is shown. */
const Council = (() => {
  let page = null, sink = null;          // sink: called with each new live step while the page is open in live mode
  const KEEP = 10;                       // full records kept on the phone; older ones are dropped (they are big)
  const IDX = 'adarsh.cn.idx', PRE = 'adarsh.cn.';
  const mem = new Map();                 // records of this session, even when storage is full or unavailable
  const lsGet = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } };
  const lsDel = (k) => { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } };
  const index = () => { try { return JSON.parse(lsGet(IDX) || '[]'); } catch (e) { return []; } };
  /* Records live under their own keys, NOT inside the chat state: one big record must never make saving chats fail. */
  function put(id, rec) {
    mem.set(id, rec);
    let idx = index().filter(x => x !== id); idx.push(id);
    const text = JSON.stringify(rec);
    while (!lsSet(PRE + id, text) && idx.length > 1) { const old = idx.shift(); lsDel(PRE + old); if (old === id) break; }  // quota: drop the oldest
    while (idx.length > KEEP) lsDel(PRE + idx.shift());
    lsSet(IDX, JSON.stringify(idx));
    if (mem.size > KEEP) mem.delete(mem.keys().next().value);
  }
  function get(id) {
    if (mem.has(id)) return mem.get(id);
    const t = lsGet(PRE + id); if (!t) return null;
    try { const r = JSON.parse(t); mem.set(id, r); return r; } catch (e) { return null; }
  }

  const fmtS = (s) => (s == null ? '' : s >= 60 ? Math.floor(s / 60) + 'm ' + Math.round(s % 60) + 's' : (s >= 10 ? Math.round(s) : Math.round(s * 10) / 10) + 's');
  const clip = (t, n) => { t = String(t || '').replace(/\s+/g, ' ').trim(); return t.length > n ? t.slice(0, n) + '…' : t; };
  const pre = (t) => h('pre', { class: 'raw' }, String(t == null ? '' : t));
  const fold = (title, content, open) => { const d = h('details', { class: 'fold' }, h('summary', {}, icon('chev', 'chev'), title), h('div', { class: 'fb' }, content)); if (open) d.open = true; return d; };
  const pill = (t, cls) => h('span', { class: 'pill ' + (cls || 'mute') }, t);
  const row = (k, v) => h('div', { class: 'kv' }, h('span', { class: 'k' }, k), h('span', {}, v));

  /* ---------------------------------------------------------------- inline block */
  function shell(label, onOpen, running) {
    const lines = h('div', { class: 'tl' });
    const chv = h('button', { class: 'chv', 'aria-label': 'Lines dikhao/chhupao', on: { click: (e) => { e.stopPropagation(); el.classList.toggle('open'); lines.scrollTop = lines.scrollHeight; } } }, icon('chev', 'chev'));
    const lab = h('span', { class: 'lab' }, label);
    const head = h('div', { class: 'th' }, running ? h('span', { class: 'dots' }, h('i'), h('i'), h('i')) : null, lab, h('span', { style: 'flex:1' }), chv);
    const el = h('div', { class: 'think2' + (running ? ' run' : ''), role: 'button', tabindex: '0', 'aria-label': 'Poora detail page kholo',
      on: { click: onOpen, keydown: (e) => { if (e.key === 'Enter') onOpen(); } } }, head, lines);
    return { el, lines, lab };
  }
  /* live: returned to runBackend, which pushes each progress line into it */
  function live() {
    const steps = [];
    const s = shell('Thinking', () => open(null, steps), true);
    const api = {
      el: s.el, steps,
      push(t) { steps.push(t); s.lines.append(h('div', { class: 'tline' }, t)); s.lines.scrollTop = s.lines.scrollHeight; if (sink) sink(t); }
    };
    return api;
  }
  /* done: the folded block under a finished reply */
  function done(r) {
    if (!r || !r.councilId) return null;
    const rec0 = get(r.councilId);
    const took = r.took != null ? r.took : (rec0 && rec0.setup && rec0.setup.latency_s);
    const s = shell('Thought for ' + fmtS(took), () => open(get(r.councilId), r.thinkLines || r.steps || [], true), false);
    (r.thinkLines || r.steps || []).forEach(t => s.lines.append(h('div', { class: 'tline' }, t)));
    return s.el;
  }

  /* ---------------------------------------------------------------- page shell */
  function close() { if (page) { page.remove(); page = null; sink = null; } }
  function open(rec, steps, wasRecorded) {
    close();
    const stack = h('div', { class: 'stack cn' });
    const title = h('h1', {}, 'Kisne kya socha');
    page = h('section', { class: 'view on council', role: 'dialog', 'aria-label': 'Kisne kya socha' },
      h('header', { class: 'hdr pad' }, ibtn('back', 'Wapas', close), title, h('span')),
      h('div', { class: 'scroll pad' }, stack));
    $('#phone').append(page);
    if (rec) render(stack, rec);
    else if (wasRecorded) stack.append(h('p', { class: 'muted' }, 'Is jawab ka poora record ab nahi hai: phone par sirf pichhle ' + KEEP + ' jawab ka detail rakha jaata hai (ya storage bhar gaya tha). Neeche jawab ke waqt ki lines hain.'),
      h('div', { class: 'tl big' }, (steps || []).map(t => h('div', { class: 'tline' }, t))));
    else renderLive(stack, steps || []);
  }
  window.__adarshBack = () => { if (page) { close(); return true; } return false; };

  function renderLive(stack, steps) {
    const box = h('div', { class: 'tl big' }, steps.map(t => h('div', { class: 'tline' }, t)));
    stack.append(h('p', { class: 'muted' }, 'Engine abhi kaam kar raha hai. Jawab aate hi yahan har role ka poora detail (prompt, draft, kya hataya gaya) milega. Tab tak lines live dikh rahi hain.'), box);
    sink = (t) => { box.append(h('div', { class: 'tline' }, t)); box.scrollTop = box.scrollHeight; };
  }

  /* ---------------------------------------------------------------- full record */
  const sec = (id, title, sub, ...kids) => h('section', { class: 'csec', id: 'cn-' + id }, h('h2', {}, title), sub ? h('p', { class: 'muted' }, sub) : null, ...kids);

  function render(stack, rec) {
    const calls = rec.calls || [], drafts = rec.drafts || [], su = rec.setup || {};
    const master = su.engine === 'master', ls = rec.lessons || {};
    const byStage = (p) => calls.filter(c => (c.stage || '').startsWith(p));
    const one = (s) => calls.find(c => c.stage === s);
    const letterName = (l) => { const d = drafts.find(x => x.letter === l); return d ? l + ' · ' + d.title : l; };

    const modelLine = (c) => {
      const bits = [];
      if (c.ok === false) bits.push('Fail: koi model jawab nahi de paya');
      else if (c.used) bits.push('Chala: ' + c.used + (c.asked && c.asked !== c.used ? ' (pehle ' + c.asked + ' tha, fallback hua)' : ''));
      if (c.secs != null) bits.push(fmtS(c.secs));
      return bits.join(' · ');
    };
    const skipsEl = (c) => { const e = Object.entries(c.skips || {}); return e.length ? h('div', { class: 'skips' }, e.map(([m, r]) => h('div', {}, '↳ ' + m + ' skip: ' + r))) : null; };
    const promptEl = (c) => (c.prompt && c.prompt.length)
      ? fold('Ise kya mila (poora prompt)', c.prompt.map(m => h('div', {}, h('span', { class: 'k' }, m.role), pre(m.content)))) : null;
    const outputEl = (c, openIt) => c.output ? fold('Poora jawab · ' + String(c.output).split(/\s+/).length + ' shabd', md(c.output), openIt) : null;
    const callCard = (c, extra, openOut) => h('div', { class: 'ccard' + (c.ok === false ? ' bad' : '') },
      h('div', { class: 'ch' }, h('b', {}, c.title || c.stage), pill(c.ok === false ? 'fail' : 'ok', c.ok === false ? 'bad' : 'good')),
      c.brief ? h('p', { class: 'muted' }, c.brief) : null,
      h('div', { class: 'ml' }, modelLine(c)), skipsEl(c), extra, promptEl(c), outputEl(c, openOut));

    /* ---- scorecard */
    const used = {};
    calls.forEach(c => { if (c.ok !== false && c.used) used[c.used] = (used[c.used] || 0) + 1; });
    const failed = calls.filter(c => c.ok === false).length;
    const fallbacks = calls.filter(c => c.ok !== false && c.asked && c.used && c.asked !== c.used).length;
    const pv = rec.provenance, p = rec.patterns || {};
    const cm = rec.claims_map, nClaims = cm ? Object.values(cm.claims || {}).reduce((a, v) => a + v.length, 0) : 0;
    const au = rec.audit || {}, proofs = rec.proofs || [];
    const stat = (k, v, sub) => h('div', { class: 'stat' }, h('span', { class: 'k' }, k), h('b', {}, v), sub ? h('small', {}, sub) : null);
    const panelCalls = byStage('panel:');
    const score = h('div', { class: 'stats' },
      stat('Time', fmtS(su.latency_s) || '—'),
      stat('Drafts', String(drafts.length), (su.user_answers ? su.user_answers + ' tumhare + ' : '') + (su.panel_answers || 0) + ' panel'),
      stat('Fail / fallback', failed + ' / ' + fallbacks, 'model calls'),
      stat('Claims', cm ? String(nClaims) : '—', cm ? (cm.consensus || []).length + ' sahmati, ' + (cm.conflicts || []).length + ' takraav' : 'map nahi bana'),
      master ? stat('Lessons', String((ls.lessons_used || []).length), (ls.repeated || []).length + ' dohraye gaye') : stat('Falsifier', String(Object.keys(rec.falsifiers || {}).length), 'reports'),
      stat(master ? 'Grounding' : (au.label || 'Audit'), au.enabled ? (au.ran ? (au.applied || []).length + ' sudhar' : 'chala nahi') : 'band', au.ran ? (au.unsure || []).length + ' shak' : ''));
    const modelsEl = h('div', { class: 'chips' }, Object.entries(used).map(([m, n]) => h('span', { class: 'chip' }, m + ' ×' + n)));

    /* ---- timeline (tap = jump) */
    const go = (id) => { const t = page && page.querySelector('#cn-' + id); if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' }); };
    const tl = (id, ic, title, note) => h('button', { class: 'tlrow', on: { click: () => go(id) } }, icon(ic, 's'), h('b', {}, title), h('span', { class: 'muted' }, note), icon('chev', 'chev'));
    const nPanelOk = panelCalls.filter(c => c.ok !== false).length;
    const timeline = h('div', { class: 'tlist' },
      tl('setup', 'check', 'Sawaal samjha', (su.task || '') + ' · ' + (su.style || '')),
      rec.roles ? tl('roles', 'check', '11-role council', (rec.roles.mode || '') + ' mode · ' + (rec.roles.sources || []).length + ' sources · confidence ' + (rec.roles.confidence || '—')) : null,
      tl('panel', 'check', master ? 'Tumhare paste kiye answers' : 'Panel ke drafts', master ? drafts.length + ' answers (panel nahi chala)' : nPanelOk + '/' + (panelCalls.length || drafts.length) + ' roles ne diye'),
      master ? null : tl('patterns', 'check', 'Patterns', (rec.patterns && rec.patterns.named) ? rec.patterns.named : 'koi naam nahi mila'),
      tl('claims', 'check', 'Claims map', cm ? nClaims + ' claims' : 'nahi bana'),
      master ? null : tl('fals', 'check', 'Falsifiers', Object.keys(rec.falsifiers || {}).length + ' reports'),
      master ? null : tl('proofs', 'check', 'Code proofs', proofs.length ? proofs.length + ' checks' : (su.style === 'solve' ? 'Android par band' : 'is jawab me nahi')),
      tl('judge', 'check', master ? 'Master answer likha' : 'Judge', (one('judge') || {}).used || '—'),
      tl('repair', 'check', 'Format repair', (rec.repairs || []).length ? (rec.repairs || []).length + ' baar' : 'zaroorat nahi padi'),
      tl('audit', 'check', master ? 'Grounding check' : (au.label || 'Audit'), au.ran ? (au.applied || []).length + ' sudhar, ' + (au.unsure || []).length + ' shak' : (au.enabled ? 'chala nahi' : 'band')),
      master ? tl('lessons', 'check', 'Lessons', (ls.lessons_used || []).length + ' lage, ' + (ls.learned || []).length + ' naye/majboot') : null,
      tl('prov', 'check', 'Kya aaya, kya gaya', 'draft se final tak'));

    if (rec.trimmed) stack.append(h('p', { class: 'warn' }, 'Record bada tha, isliye kuch prompts chhote karke dikhaye gaye hain (model ko poore gaye the).'));
    stack.append(
      h('p', { class: 'muted qline' }, '“' + clip(rec.question, 160) + '”'),
      score, modelsEl,
      timeline);

    /* ---- roles (11-role engine) */
    if (rec.roles) {
      const R = rec.roles, src = R.sources || [];
      const linkEl = (x) => x.url ? h('a', { href: x.url, target: '_blank', rel: 'noopener' }, x.title || x.url) : h('span', {}, x.title || '');
      const deb = R.debate || [], rf = R.refiner || {}, rv = R.reviews || {};
      const revLine = (k, n) => { const r = rv[k]; return r ? row(n, r.ran ? (r.issues || []).length + ' galti/shak' : 'output padha nahi gaya') : row(n, 'is mode me nahi chala'); };
      stack.append(sec('roles', '11-role council', 'Architect ne plan banaya, web se sources padhe, drafters ne likha, Skeptic/Falsifier/Debater ne todne ki koshish ki, Judge ne likha, Reviewers ne jaancha, Refiner ne sudhara.',
        h('div', { class: 'ccard' }, row('Mode', R.mode || '—'), row('Format', R.format || '—'),
          row('Confidence', R.confidence || '—'),
          R.quota ? row('Quota', (R.quota.level === 'ok' ? 'theek' : R.quota.level === 'tight' ? 'kam' : 'bahut kam') + ' · ~' + Math.round((R.quota.left || 0) * 100) + '% bacha') : null,
          R.quota && (R.quota.saved || []).length ? h('p', { class: 'warn' }, 'Quota bachane ke liye: ' + R.quota.saved.join(', ')) : null),
        R.combo ? fold((R.combo.title || R.mode) + ' mode ka model combo', h('div', {},
          R.combo.why ? h('p', { class: 'muted' }, R.combo.why) : null,
          h('table', { class: 'combo-t' }, h('tbody', {},
            Object.entries(R.combo.models || {}).map(([k, v]) => h('tr', {}, h('td', {}, k), h('td', {}, v))),
            h('tr', {}, h('td', {}, 'falsifiers'), h('td', {}, (R.combo.falsifiers || []).join(', '))))),
          R.combo.policy ? h('p', { class: 'muted' }, 'Policy: depth ' + R.combo.policy.depth + ' · falsifiers ' + (R.combo.policy.falsifiers || []).join('/') +
            ' · debate ' + R.combo.policy.debate + ' · reviewers fast ' + (R.combo.policy.reviewers_fast || []).join('+') + ', deep ' + (R.combo.policy.reviewers_deep || []).join('+') +
            ' · research ' + R.combo.policy.research + ' (max ' + R.combo.policy.max_sources + ') · code proofs ' + R.combo.policy.code_proofs) : null)) : null,
        R.plan ? fold('Architect ka plan', md(R.plan), true) : null,
        one('architect') ? callCard(one('architect')) : null,
        h('div', { class: 'ccard' }, h('div', { class: 'ch' }, h('b', {}, 'Research'), pill(src.length + ' sources', src.length ? 'good' : 'mute')),
          (R.queries || []).length ? row('Search', (R.queries || []).join(' · ')) : h('p', { class: 'muted' }, 'Architect ne search ki zaroorat nahi samjhi (ya research band hai).'),
          src.length ? h('ol', {}, src.map(x => h('li', {}, '[S' + x.n + '] ', linkEl(x), x.via ? h('span', { class: 'muted' }, ' · ' + x.via) : null))) : null),
        R.skeptic ? fold('Skeptic ke shak', md(R.skeptic)) : null,
        one('skeptic') ? callCard(one('skeptic')) : null,
        R.pattern ? fold('Pattern Finder', md(R.pattern)) : null,
        h('div', { class: 'ccard' }, h('div', { class: 'ch' }, h('b', {}, 'Debate'), pill(deb.length ? deb.length + ' round' : 'skip', deb.length ? 'info' : 'mute')),
          deb.length ? deb.map((t, i) => fold('Round ' + (i + 1), md(t))) : h('p', { class: 'muted' }, R.debate_skipped || 'Debate nahi chala.')),
        byStage('debate:').map(c => callCard(c)),
        h('div', { class: 'ccard' }, h('div', { class: 'ch' }, h('b', {}, 'Reviewers & Refiner')),
          revLine('method', 'Methodology'), revLine('evidence', 'Evidence'),
          row('Refiner', rf.changes ? (rf.changes.length + ' badlav' + ((rf.skipped || []).length ? ', ' + rf.skipped.length + ' chhode' : '')) : 'zaroorat nahi padi'),
          (rf.changes || []).length ? h('ul', {}, rf.changes.map(x => h('li', {}, x))) : null,
          (rf.skipped || []).length ? fold('Refiner ne ye nahi badla', h('ul', {}, rf.skipped.map(x => h('li', {}, x)))) : null)));
    }
    /* ---- setup */
    stack.append(sec('setup', 'Sawaal ka setup', null,
      row('Task', su.task), row('Style', su.style === 'explain' ? 'explain (samjhana)' : 'solve (hal karna)'),
      row('Source', su.source), row('Mode', su.mode + (su.engine ? ' · ' + su.engine + ' engine' : '')),
      row('Depth / language', (su.depth || '') + ' · ' + (su.reply_lang || '')),
      one('classify') ? callCard(one('classify')) : null,
      su.fallback ? h('p', { class: 'warn' }, 'Panel ke kaafi drafts nahi mile, isliye ek akele model ne jawab diya.') : null));

    /* ---- panel + pasted answers */
    const panelKids = [];
    drafts.filter(d => d.kind === 'user').forEach(d => panelKids.push(h('div', { class: 'ccard' },
      h('div', { class: 'ch' }, h('b', {}, 'Tumhara paste kiya: ' + d.title), pill('letter ' + (d.letter || '?'))),
      fold('Poora jawab', md(d.text)),
      (rec.guard && rec.guard[d.name]) ? h('p', { class: 'muted' }, 'Guard: ' + (rec.guard[d.name].flagged ? 'FLAG hua (score ' + Number(rec.guard[d.name].max_score).toFixed(2) + ')' : 'saaf')) : null)));
    panelCalls.forEach(c => {
      const d = drafts.find(x => 'panel:' + x.name === c.stage);
      const bits = [];
      if (d && d.letter) bits.push('Judge ko letter ' + d.letter + ' ke naam se dikha (brand chhupa kar)');
      if (d && cm && cm.claims && cm.claims[d.letter]) bits.push('Claims map me ' + cm.claims[d.letter].length + ' claims');
      if (d && pv && pv.share) bits.push('final ke ' + (pv.share[d.name] || 0) + ' vaakya isse milte hain');
      if (c.stage === 'panel:pattern_finder' && p.named) bits.push('Pattern: ' + p.named);
      panelKids.push(callCard(c, bits.length ? h('div', { class: 'ml' }, bits.join(' · ')) : null));
    });
    if (master) panelKids.push(h('p', { class: 'muted' }, 'Manual mode me panel ke models nahi chalte. Master answer sirf upar ke paste kiye answers se bana.'));
    stack.append(sec('panel', master ? 'Tumhare paste kiye answers' : 'Panel: har role ne kya kiya', 'Har role ko alag soch ka brief mila. Neeche uska prompt, kaun sa model chala, aur poora jawab hai.', panelKids));

    /* ---- patterns */
    if (!master) stack.append(sec('patterns', 'Patterns', 'Pattern finder ne jo naam diya, aur drafts me kya common/alag nikla.',
      row('Pattern finder ka naam', p.named || 'koi pakka pattern nahi mila'),
      (p.shared && p.shared.length) ? h('div', {}, h('span', { class: 'k' }, 'Sab drafts me common'), h('ul', {}, p.shared.map(x => h('li', {}, x)))) : null,
      (p.split && p.split.length) ? h('div', {}, h('span', { class: 'k' }, 'Jahan drafts alag gaye'), h('ul', {}, p.split.map(x => h('li', {}, x)))) : null,
      p.warning ? h('p', { class: 'warn' }, p.warning) : null));

    /* ---- claims map */
    const claimKids = [];
    if (cm) {
      claimKids.push(h('span', { class: 'k' }, 'Sahmati'), h('ul', {}, (cm.consensus || []).map(x => h('li', {}, x))));
      if ((cm.conflicts || []).length) {
        claimKids.push(h('span', { class: 'k' }, 'Takraav'));
        cm.conflicts.forEach(c => claimKids.push(h('div', { class: 'conf' }, h('b', {}, c.issue + ' '), pill(c.kind === 'factual' ? 'factual: sach-jhooth' : 'choice: galti nahi', c.kind === 'factual' ? 'bad' : 'mute'),
          Object.entries(c.positions || {}).map(([l, v]) => h('div', {}, h('span', { class: 'k' }, letterName(l)), ' ' + v)))));
      }
      Object.entries(cm.claims || {}).forEach(([l, list]) => claimKids.push(fold(letterName(l) + ' ke ' + list.length + ' claims', h('ol', {}, list.map(x => h('li', {}, x))))));
    } else claimKids.push(h('p', { class: 'warn' }, 'Tone-stripper claims map nahi bana paya, judge ne seedhe drafts dekhe.'));
    const strip = one('stripper');
    stack.append(sec('claims', 'Claims map (tone-stripper)', 'Drafts se lehja, jazba aur confidence hata kar sirf sidhe claims nikale gaye.',
      claimKids, strip ? callCard(strip) : null));

    /* ---- falsifiers */
    const fk = Object.entries(rec.falsifiers || {});
    if (!master) stack.append(sec('fals', 'Falsifiers', 'Inka kaam sahmati ko todna hai. Model aksar ek jaisi galti saath me karte hain.',
      byStage('falsifier:').map(c => {
        const rep = (rec.falsifiers || {})['Falsifier ' + c.stage.split(':')[1]];  // only when the call itself left no output
        return callCard(c, (!c.output && rep) ? fold('Report', md(rep), true) : null, true);
      }),
      fk.length ? null : h('p', { class: 'warn' }, 'Koi falsifier report nahi mili.')));

    /* ---- proofs */
    if (!master) stack.append(sec('proofs', 'Code proofs', null,
      proofs.length ? proofs.map(x => h('div', { class: 'ccard' }, h('div', { class: 'ch' }, h('b', {}, clip(x.claim, 120)), pill(x.status, x.status === 'PASS' ? 'good' : 'bad')),
        fold('Code', pre(x.code)), x.output ? fold('Output', pre(x.output)) : null))
        : h('p', { class: 'muted' }, su.style === 'solve' ? 'Is phone par Python code chalane ki suvidha nahi hai, isliye steps [REASONED] hain, [PROVEN by code] nahi.' : 'Samjhane wale jawab me code-proof nahi chalta.'),
      one('verifier') ? callCard(one('verifier')) : null));

    /* ---- judge */
    const jc = one('judge');
    stack.append(sec('judge', master ? 'Master answer kaise bana' : 'Judge: final jawab kaise bana', master ? 'Ek model ne sirf paste kiye answers ke claims se 7 section wala jawab likha. Har baat par source tag [A], [B] lagta hai.' : 'Judge ne claims map, falsifier reports aur proofs dekh kar jawab likha.',
      jc ? callCard(jc) : h('p', { class: 'warn' }, 'Judge fail hua, sabse lamba draft diya gaya.'),
      rec.judge_raw ? fold('Judge ka pehla jawab (repair/audit se pehle)', md(rec.judge_raw)) : null));

    /* ---- repairs */
    const rp = rec.repairs || [];
    stack.append(sec('repair', 'Format repair', 'Judge ne zaroori section chhod diya to jawab dikhane se pehle dobara likhwaya gaya.',
      rp.length ? rp.map(r => h('div', { class: 'ccard' }, h('div', { class: 'ch' }, h('b', {}, 'Koshish ' + r.attempt), pill('gayab: ' + (r.missing || []).join(', '), 'bad')),
        fold('Pehle (adhoora)', md(r.before)), r.after ? fold('Baad me (dobara likha)', md(r.after)) : h('p', { class: 'warn' }, 'Dobara likhwane par bhi jawab nahi aaya.')))
        : h('p', { class: 'muted' }, 'Zaroorat nahi padi, judge ka jawab pehli baar me sahi format me tha.'),
      byStage('repair').map(c => callCard(c))));

    /* ---- audit */
    const key = (i) => (i.quote || '') + '|' + (i.fix || '');
    const applied = new Set((au.applied || []).map(key));
    const auc = one('audit'), rev = one('revise') || one('refine');
    const issueEl = (i) => h('div', { class: 'ccard' }, h('div', { class: 'ch' }, pill(i.confidence || 'low', i.confidence === 'high' ? 'bad' : i.confidence === 'medium' ? 'warn' : 'mute'),
      pill(applied.has(key(i)) ? 'sudhara gaya' : 'sirf shak, badla nahi', applied.has(key(i)) ? 'good' : 'mute')),
      i.quote ? row('Jawab me', '“' + i.quote + '”') : null, row('Galti', i.problem), row('Sahi', i.fix));
    stack.append(sec('audit', master ? 'Grounding check: kya ye answers me hai?' : (au.label === 'Reviewers' ? 'Reviewers + Refiner: final jawab ki jaanch' : 'Audit: doosre model ne fact check kiya'), master ? 'Doosre model ne sirf ye dekha ki har baat kisi paste kiye answer se milti hai ya nahi. Sach-jhooth nahi, sirf "source hai ya nahi".' : 'Judge se alag family ka model. High/medium confidence wali galtiyan rewrite se sudhaari gayin, low sirf shak ke roop me dikhi.',
      !au.enabled ? h('p', { class: 'muted' }, 'Audit band hai.') : null,
      auc ? callCard(auc) : null,
      byStage('review:').map(c => callCard(c)),
      au.ran ? ((au.issues || []).length ? (au.issues || []).map(issueEl) : h('p', { class: 'muted' }, 'Koi galti nahi mili.')) : (au.enabled ? h('p', { class: 'warn' }, 'Audit chala nahi ya uska output padha nahi gaya.') : null),
      rev ? callCard(rev) : null,
      au.before ? fold('Sudhaar se pehle ka jawab', md(au.before)) : null,
      au.after ? fold('Sudhaar ke baad ka jawab', md(au.after), true) : null,
      au.discarded ? h('div', {}, h('p', { class: 'warn' }, 'Rewrite me zaroori section kho gaye the, isliye wo jawab fenk diya gaya.'), fold('Fenka hua rewrite', md(au.discarded))) : null));

    /* ---- lessons (manual master only) */
    if (master) {
      const used = ls.lessons_used || [], rep = new Set(ls.repeated || []);
      stack.append(sec('lessons', 'Lessons: pichhli galtiyon se seekha', 'Model ke weights nahi badalte. Rules ki ek chhoti list har master prompt me jaati hai. Jo rule tootta hai uska wazan badhta hai.',
        used.length ? used.map(x => h('div', { class: 'ccard' }, h('div', { class: 'ch' }, h('b', {}, x.title || 'Tumhara rule'), pill(x.origin === 'user' ? 'tumhara' : 'auto', x.origin === 'user' ? 'info' : 'mute'),
          pill(rep.has(x.id) ? 'phir toota' : 'nibhaya', rep.has(x.id) ? 'bad' : 'good')), h('p', {}, x.text)))
          : h('p', { class: 'muted' }, 'Abhi koi lesson nahi tha. Galti pakdi gayi to yahan judega.'),
        (ls.learned || []).length ? h('div', {}, h('span', { class: 'k' }, 'Is baar naya seekha'), h('ul', {}, ls.learned.map(x => h('li', {}, x.kind + (x.new ? ' (naya rule)' : ' (rule majboot)'))))) : null));
    }

    /* ---- provenance */
    if (pv) {
      const total = Object.values(pv.share || {}).reduce((a, b) => a + b, 0) || 1;
      const nm = (n) => { const d = drafts.find(x => x.name === n); return d ? d.title : n; };
      const dropped = Object.entries(pv.dropped || {});
      stack.append(sec('prov', 'Kya aaya, kya gaya', pv.note,
        Object.keys(pv.share || {}).length ? h('div', { class: 'bars' }, Object.entries(pv.share || {}).sort((a, b) => b[1] - a[1]).map(([n, c]) =>
          h('div', { class: 'bar' }, h('span', {}, nm(n)), h('i', { style: 'width:' + Math.round(100 * c / total) + '%' }), h('b', {}, c + ' vaakya')))) : null,
        fold('Final jawab ke vaakya aur unka source', pv.final_sentences.map(s => h('div', { class: 'ps' }, h('span', { class: 'k' }, s.from ? nm(s.from) + ' · ' + s.score : 'naya (kisi draft se nahi mila)'), s.text))),
        dropped.length ? h('div', {}, h('span', { class: 'k' }, 'Drafts ki ye baatein final me nahi aayin'), dropped.map(([n, list]) =>
          fold(nm(n) + ' · ' + list.length, h('ul', {}, list.map(x => h('li', {}, x)))))) : h('p', { class: 'muted' }, 'Drafts ki koi bada hissa chhoota nahi mila.')));
    }

    /* ---- problems + final */
    const errs = Object.entries(rec.errors || {}), ws = rec.warnings || [];
    if (errs.length || ws.length) stack.append(sec('errs', 'Dikkatein', null,
      errs.map(([k, v]) => row(k, clip(v, 400))), ws.map(w => h('p', { class: 'warn' }, w))));
    stack.append(sec('final', 'Final jawab', null, md(rec.final || '')));
  }

  return { live, done, open, close, put, get, KEEP };
})();

/* Lessons: the one-line "kya galat tha" after a thumbs-down on a MANUAL master answer, and the list of rules.
   No model is called here. The rules are stored on the device (or the server) and put into the next master prompt. */
const Lessons = (() => {
  const call = async (op) => { try { return await Backend.lessons(op); } catch (e) { return { ok: false, error: 'Lessons nahi khule.' }; } };
  const HINTS = [
    ['Source/tag galat', 'Source tag galat laga: baat us answer me nahi thi jiska tag diya.'],
    ['Apni taraf se likha', 'Apni taraf se baat likhi. Sirf paste kiye answers ki baat likho.'],
    ['Section chhoota', 'Koi section chhoot gaya. Saare 7 section hone chahiye.'],
    ['Naam/saal gadha', 'Naam ya saal bina source ke likha. Na ho to likho: Paste kiye answers me nahi hai.'],

  };

      if (Date.now() < until) { p.shake(); msg.textContent = 'Too many tries. Wait ' + Math.ceil((until - Date.now()) / 1000) + 's.'; return; }
      if (await verify(pin)) { fails = 0; activePad = null; root.hidden = true; root.textContent = ''; return; }
      fails++; p.shake(); vibe(30);
      if (fails >= 5) { until = Date.now() + 30000; fails = 0; msg.textContent = 'Too many tries. Locked for 30 s.'; } else msg.textContent = 'Wrong PIN. ' + (5 - fails) + ' tries left.';
    });
    activePad = pad;
    root.append(h('div', { class: 'mark' }, 'A'), h('h2', {}, 'ADARSH'), msg, pad.el,
      h('button', { class: 'link', on: { click: forgot } }, 'Forgot PIN?'));
  }
  function forgot() {
    confirmSheet({ title: 'Reset this device?', top: true, text: 'The PIN can’t be recovered. Resetting removes the PIN and ALL chats, memory and tasks stored on this device. Your backend data is not touched.', label: 'Erase and reset', danger: true,
      onYes: () => { Object.assign(S, DEFAULTS()); saveNow(); activePad = null; const r = $('#lock'); r.hidden = true; r.textContent = ''; App.applyTheme(); App.buildDrawer(); App.drawerList(); Chat.renderThread(); toast('Device reset'); } });
  }

  /* ----- setup / change / remove (inside sheets) ----- */
  function pinSheet(title, prompt, check) {
    return new Promise((resolve) => {
      let done = false;
      const close = sheet({ title, build(b, closeFn) {
        const msg = h('p', { class: 'center', role: 'status' }, prompt);
        const pad = pinPad(4, async (pin, p) => {
          const r = await check(pin);
          if (r === false) { p.shake(); msg.textContent = 'Not right, try again.'; return; }
          done = true; activePad = null; closeFn(); resolve(pin);
        });
        activePad = pad; b.append(msg, h('div', { style: 'display:flex;justify-content:center;padding:6px 0 10px' }, pad.el));
      } });
      const mo = new MutationObserver(() => { if (!document.querySelector('.shade [role=dialog][aria-label="' + title + '"]')) { mo.disconnect(); activePad = null; if (!done) resolve(null); } });
      mo.observe($('#phone'), { childList: true });
    });
  }
  async function setup(after) {
    const first = await pinSheet('Set a PIN', 'Choose a 4-digit PIN', () => true); if (!first) return;
    const again = await pinSheet('Confirm PIN', 'Enter it once more', (p) => p === first ? true : false); if (!again) return;
    S.lock = await make(first); save(); toast('PIN lock is on'); if (after) after();
  }
  async function manage(after) {
    if (!S.lock) return setup(after);
    sheet({ title: 'App lock', build(b, close) {
      const row = (ic, t, s, fn) => h('button', { class: 'opt-row', on: { click: () => { close(); fn(); } } }, icon(ic), h('span', { class: 't' }, h('b', {}, t), h('small', {}, s)));
      b.append(row('lock', 'Change PIN', 'Enter current PIN first', async () => { const ok = await pinSheet('Current PIN', 'Enter your current PIN', verify); if (ok) { const old = S.lock; S.lock = null; await setup(after); if (!S.lock) S.lock = old; } }),
        row('x', 'Remove PIN', 'Turn the lock off', async () => { const ok = await pinSheet('Current PIN', 'Enter your current PIN', verify); if (ok) { S.lock = null; save(); toast('PIN lock is off'); if (after) after(); } }),
        h('p', {}, 'This lock only hides the app on this device. Real protection is your backend token and allow-list.'));
    } });
  }

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) hiddenAt = Date.now();
    else if (S.lock && S.settings.lockOnHide && hiddenAt && Date.now() - hiddenAt > (S.settings.lockAfter || 30) * 1000) lockNow();
  });
  return { lockNow, manage, setup };
})();

'use strict';
/* 07-backend.js : the adapter seam.
   The UI only ever calls Backend.send(). Plug in your architecture by either
     (a) defining  window.ADARSH_BACKEND = { send(req,{onProgress,signal}), missionAction?, ping?, suggestions? }  before this script, or
     (b) filling Settings > Connection with an HTTP endpoint (JSON in / JSON out, see ARCHITECTURE.md).
   With neither, a clearly-labelled demo backend runs so every screen can be tried. */

const DemoBackend = (() => {
  const wait = (ms, signal) => new Promise((res, rej) => {
    const t = setTimeout(res, ms); if (signal) signal.addEventListener('abort', () => { clearTimeout(t); rej(new DOMException('Aborted', 'AbortError')); });
  });
  function parseDue(t) {
    const d = new Date(); let hit = false;
    if (/\b(tomorrow|kal)\b/i.test(t)) { d.setDate(d.getDate() + 1); hit = true; } else if (/\b(today|aaj)\b/i.test(t)) hit = true;
    const m = /(\d{1,2})(?::(\d{2}))?\s*(am|pm)\b/i.exec(t);
    if (m) { let hr = +m[1] % 12; if (/pm/i.test(m[3])) hr += 12; d.setHours(hr, +(m[2] || 0), 0, 0); hit = true; } else d.setHours(9, 0, 0, 0);
    return hit ? d.getTime() : null;
  }

  /* DEMO ONLY: one sample answer per mode so the layout of maths, tables and code can be previewed without a server. */
  const MODE_DEMO = {
    v: ['**Short answer** *(demo reply)*', '', 'The claim holds in the usual case, with one limit.', '', '**What was checked**', '',
      '- The definition and the exact figure were compared against two independent derivations.', '- One edge case changes the result, so the answer is conditional.', '',
      '> In V mode your backend decides how answers are double-checked.'].join('\n'),
    physics: ['**Escape velocity of Earth** *(demo reply)*', '', 'Set the kinetic energy at the surface equal to the work needed to reach infinity:', '',
      '$$\\frac{1}{2} m v_e^2 = \\frac{G M m}{R}$$', '', 'so', '', '$$v_e = \\sqrt{\\frac{2GM}{R}} \\approx 11.2\\ \\text{km/s}$$', '',
      '**Sanity check.** $GM/R$ has units $\\text{m}^2\\text{s}^{-2}$, so $v_e$ comes out in m/s. ✓', '',
      '| Quantity | Value |', '|---|---|', '| $G$ | $6.67\\times10^{-11}\\ \\text{N m}^2\\text{kg}^{-2}$ |', '| $M$ | $5.97\\times10^{24}\\ \\text{kg}$ |', '| $R$ | $6.37\\times10^{6}\\ \\text{m}$ |'].join('\n'),
    math: ['**Solve** $x^2 - 5x + 6 = 0$ *(demo reply)*', '', '1. Find two numbers with product $6$ and sum $-5$: they are $-2$ and $-3$.', '2. Write $(x-2)(x-3)=0$.',
      '3. A product is zero when a factor is zero, so $x = 2$ or $x = 3$.', '', 'Check with the quadratic formula:', '',
      '$$x = \\frac{-b \\pm \\sqrt{b^2-4ac}}{2a} = \\frac{5 \\pm 1}{2}$$'].join('\n'),
    business: ['**Pricing comparison** *(demo reply)*', '', '| Plan | Price | Margin | Best for |', '|---|---:|---:|---|', '| Basic | $9 | 62% | Individuals |', '| Pro | $29 | 71% | Small teams |', '| Scale | $99 | 78% | Larger accounts |', '',
      '**Read-out.** Margin rises with price, but only Pro has both a healthy margin and a low barrier to buy.', '', '- Test Pro at $24 and $34 before changing the list price.', '- Watch churn on Scale for two quarters.'].join('\n'),
    coding: ['**Debounce a function** *(demo reply)*', '', '```js', 'function debounce(fn, wait = 300) {', '  let timer;', '  return (...args) => {', '    clearTimeout(timer);', '    timer = setTimeout(() => fn(...args), wait);', '  };', '}', '```', '',
      'Call it from an input handler, for example `input.oninput = debounce(search, 250)`.', '', '**Edge case.** Each call resets the timer, so a user who keeps typing never triggers `search` until they pause.'].join('\n')
  };
  async function steps(list, o) { for (const s of list) { o.onProgress(s); await wait(420, o.signal); } }

  async function send(req, o) {
    const t = (req.text || '').trim(), m = req.meta || {};
    if (m.answer) {
      await steps(['Reading your answers', 'Building the plan'], o);
      const a = m.answer.answers || []; const get = (k) => (a.find(x => x.header === k) || {}).answer || 'anything';
      const open = S.tasks.filter(x => !x.done).slice(0, 3).map(x => '- ' + x.title);
      return { type: 'text', text: '**Plan for today** (' + get('Focus') + ', ' + get('Time') + ')\n\n1. Start with the one thing that matters most.\n2. Block the first slot for deep work, no phone.\n3. Review open tasks.\n\n' + (open.length ? open.join('\n') : '- nothing open yet') + '\n\n*Demo reply: your real backend writes this.*' };
    }
    if (m.approval) {
      await steps(['Applying your decision'], o);
      return m.approval.decision === 'allow'
        ? { type: 'text', text: 'Done. I staged the change in a copy, ran the checks and nothing live was touched. *(demo)*' }
        : { type: 'text', text: 'Okay, I won’t do that. Tell me if you want a different approach.' };
    }
    if (/brief|briefing|aaj ka din|good morning/i.test(t)) {
      await steps(['Checking tasks', 'Checking memory'], o);
      const due = S.tasks.filter(x => !x.done).sort((a, b) => (a.due || 9e15) - (b.due || 9e15)).slice(0, 4);
      return { type: 'text', text: '**' + greeting() + ', ' + (S.settings.name || 'Adarsh') + '.**\n\n' + (due.length ? 'Open tasks:\n' + due.map(x => '- ' + x.title + (x.due ? ' (' + fmtDue(x.due).t + ')' : '')).join('\n') : 'No open tasks. A clear day.') + '\n\n' + (S.memories.length ? 'I’m keeping ' + S.memories.length + ' things in memory.' : 'Nothing in memory yet. Say “remember that…”.') + '\n\n*Demo briefing built from this device’s data.*' };
    }
    if (/plan (my )?day|plan karo|schedule my/i.test(t)) {
      await steps(['Looking at your open tasks'], o);
      return { type: 'ask', id: uid('ask'), questions: [
        { header: 'Focus', question: 'What should today be about?', options: [{ label: 'Deep work', description: 'One big thing, no meetings' }, { label: 'Catch-up', description: 'Clear small pending items' }, { label: 'Balanced' }] },
        { header: 'Time', question: 'How much time do you have?', multi: false, options: [{ label: '2 hours' }, { label: 'Half a day' }, { label: 'Full day' }] }
      ] };
    }
    if (/\b(remind|yaad dila|reminder)\b/i.test(t)) {
      const title = t.replace(/^(please\s+)?(remind me|yaad dila(na)?)( to)?/i, '').replace(/\b(tomorrow|today|kal|aaj)\b/ig, '').replace(/\d{1,2}(:\d{2})?\s*(am|pm)/ig, '').replace(/\s+/g, ' ').trim() || 'Reminder';
      await steps(['Understanding the time'], o);
      return [{ type: 'task', title: title.charAt(0).toUpperCase() + title.slice(1), due: parseDue(t) }, { type: 'text', text: 'Added. I’ll nudge you when it’s due.' }];
    }
    if (/\b(remember|yaad rakh)\b/i.test(t)) {
      const mem = t.replace(/^.*?\b(remember( that)?|yaad rakh(na)?)\b\s*/i, '').trim() || t;
      return [{ type: 'memory', text: mem }, { type: 'text', text: 'Got it. I’ll use that from now on.' }];
    }
    if (/self|audit your|your own code|improve yourself|deploy/i.test(t)) {
      await steps(['Inspecting own source (read-only)', 'Preparing a staged proposal'], o);
      return [{ type: 'text', text: 'I found one safe improvement: tighten the retry logic in the LLM router. I’d stage it in a copy and run the tests first.' },
        { type: 'approve', id: uid('ap'), title: 'Stage a change to adarsh/llm_router.py', detail: 'Creates a staged copy, runs compile + tests. Nothing goes live until you approve a deploy.', action: 'self_engineering.propose("tighten retry logic")', scope: 'Staging copy only', risk: 'medium' }];
    }
    if (/delete|send (an )?email|post |purchase|buy /i.test(t)) {
      await steps(['Checking what this touches'], o);
      return { type: 'approve', id: uid('ap'), title: 'Do this on your behalf?', detail: 'This action changes something outside the chat: “' + t.slice(0, 90) + '”.', action: 'external_action()', scope: 'One time only', risk: 'high' };
    }
    if (/debate/i.test(t)) {
      await steps(['Pro side', 'Con side', 'Moderator'], o);
      return { type: 'debate', topic: t.replace(/^debate:?\s*/i, ''), pro: 'Start with **Rust**: it forces you to understand memory and ownership, and that knowledge transfers to every language afterwards.', con: 'Start with **Go**: you ship something useful in a weekend, and motivation matters more than depth in the first month.', verdict: 'If your goal is shipping tools quickly, Go first. If your goal is systems depth, Rust first. For most people, Go then Rust works best. *(demo)*' };
    }
    if (/pattern/i.test(t)) {
      await steps(['Reading recent notes', 'Looking for repeats'], o);
      return { type: 'patterns', title: 'Patterns in your week', patterns: [{ claim: 'You plan late at night and slip the next morning.', strength: 'strong', evidence: ['3 tasks created after 11 pm', '2 of them missed their due time'], so_what: 'Plan before 9 pm or set a morning checkpoint.' }, { claim: 'Research tasks outlive everything else.', strength: 'moderate', evidence: ['Oldest open task is a research item'], so_what: 'Time-box research to 45 minutes.' }] };
    }
    if (/connect|link the dots|related/i.test(t)) {
      await steps(['Mapping ideas'], o);
      return { type: 'links', title: 'How these connect', chains: [{ nodes: ['Sleep', 'Focus', 'Output'], why: 'Poor sleep lowers focus, which shows up as less output.' }, { nodes: ['Notes', 'Memory', 'Briefing'], why: 'What you note becomes what I remember and surface in the briefing.' }] };
    }
    if (/mission/i.test(t)) {
      await steps(['Splitting into stages'], o);
      return { type: 'mission', id: uid('ms'), title: t.replace(/^start a mission:?\s*/i, '') || 'Mission', status: 'running', stages: [{ label: 'Understand the goal', status: 'completed' }, { label: 'Gather sources', status: 'completed' }, { label: 'Analyse and compare', status: 'running' }, { label: 'Verify claims', status: 'pending' }, { label: 'Write the report', status: 'pending' }, { label: 'Final check', status: 'pending' }] };
    }
    if (/research|verify|fact|sach|true/i.test(t)) {
      await steps(['Planning searches', 'Reading sources', 'Checking each claim', 'Judging the evidence'], o);
      return { type: 'research', question: t.replace(/^research( whether)?\s*/i, '') || t, confidence: 0.72, summary: 'Short-term studies show a small benefit for alertness, but results on lasting focus are mixed.',
        claims: [{ text: 'Fasting can improve alertness in the short term.', verdict: 'SUPPORTED_BY_MULTIPLE_SOURCES', checks: [{ source: 'Source 1', verdict: 'SUPPORTED_BY_ONE_SOURCE', note: 'Small trial, 40 adults' }, { source: 'Source 2', verdict: 'SUPPORTED_BY_ONE_SOURCE' }] },
          { text: 'It improves long-term concentration.', verdict: 'CONTESTED', checks: [{ source: 'Source 3', verdict: 'CONTRADICTED_BY_SOURCE', note: 'No effect after 8 weeks' }] },
          { text: 'It works for everyone.', verdict: 'UNSUPPORTED_NO_VALID_EVIDENCE', checks: [] }],
        sources: [{ n: 1, title: 'Example journal article', url: 'https://example.org/a' }, { n: 2, title: 'Example review', url: 'https://example.org/b' }, { n: 3, title: 'Example trial', url: 'https://example.org/c' }], caveat: 'Demo data: nothing here was actually searched.' };
    }
    if (MODE_DEMO[req.mode]) { await steps(['Reading the question', 'Working it out'], o); return { type: 'text', text: MODE_DEMO[req.mode] }; }
    await steps(['Thinking'], o);
    return { type: 'text', text: 'You said: “' + t + '”.\n\nThis is the **demo backend**, so I can only show how replies look. Try: *research…*, *debate…*, *remind me to… tomorrow 5pm*, *remember that…*, *plan my day*, *start a mission…*, *delete…* (permission card).' };
  }
  const missionAction = async (id, action) => ({ status: action === 'cancel' ? 'cancelled' : action === 'pause' ? 'paused' : 'running' });
  const suggestions = () => [
    { ic: 'sun', title: 'Morning briefing', sub: 'Tasks, memory and what needs you', prompt: 'Brief me on today' },
    { ic: 'cal', title: 'Plan my day', sub: 'Adarsh will ask two quick questions', prompt: 'Plan my day around my open tasks' }
  ];
  return { send, missionAction, suggestions, ping: async () => ({ ok: true, label: 'Demo backend (no server)' }) };
})();

const connUrl = () => S.conn.url || (window.ADARSH_SAME_ORIGIN ? '/api/chat' : '');

const HttpBackend = {
  async send(req, o) {
    const headers = { 'Content-Type': 'application/json' }; if (S.conn.token) headers.Authorization = 'Bearer ' + S.conn.token;
    o.onProgress('Contacting Adarsh');
    const r = await fetch(connUrl(), { method: 'POST', headers, signal: o.signal, body: JSON.stringify({ chat_id: req.chatId, text: req.text, attachments: req.attachments, history: req.history, meta: req.meta || null, source: req.source || 'auto', answers: req.answers || [], reply: req.reply || null, abilities: req.abilities, lang: req.lang, mode: req.mode || 'standard' }) });
    if (r.status === 401 || r.status === 403) throw new Error('The backend rejected the token (HTTP ' + r.status + '). Check Settings > Connection.');
    if (!r.ok) throw new Error('Backend error: HTTP ' + r.status);
    const ct = r.headers.get('content-type') || ''; if (!ct.includes('json')) return { type: 'text', text: await r.text() };
    const j = await r.json(); return Array.isArray(j) ? j : j.replies || j.reply || j;
  },
  async lessons(op) {
    try {
      const headers = { 'Content-Type': 'application/json' }; if (S.conn.token) headers.Authorization = 'Bearer ' + S.conn.token;
      const r = await fetch(connUrl(), { method: 'POST', headers, body: JSON.stringify({ lesson: op }) });
      const j = await r.json(); const x = Array.isArray(j) ? j[0] : (j.replies ? j.replies[0] : j);
      return (x && x.lessonsResult) || (x && x.ok !== undefined ? x : { ok: false, error: 'Backend ne lessons nahi diye.' });
    } catch (e) { return { ok: false, error: 'Lessons server tak nahi pahunche.' }; }
  },
  async tts(req, ms) {
    const headers = { 'Content-Type': 'application/json' }; if (S.conn.token) headers.Authorization = 'Bearer ' + S.conn.token;
    const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), ms || 30000);
    try {
      const r = await fetch(connUrl(), { method: 'POST', headers, signal: ctl.signal, body: JSON.stringify({ tts: req }) });
      if (!r.ok) return { type: 'error', error: 'HTTP ' + r.status };
      const j = await r.json(); return Array.isArray(j) ? j[0] : j;
    } finally { clearTimeout(t); }
  },
  async ping() {
    try {
      const headers = { 'Content-Type': 'application/json' }; if (S.conn.token) headers.Authorization = 'Bearer ' + S.conn.token;
      const r = await fetch(connUrl(), { method: 'POST', headers, body: JSON.stringify({ ping: true }) });
      return r.ok ? { ok: true, label: 'Connected (' + new URL(connUrl(), location.href).hostname + ')' } : { ok: false, label: 'HTTP ' + r.status };
    } catch (e) { return { ok: false, label: 'Cannot reach the server (' + (e && e.message ? e.message : 'network') + ')' }; }
  }
};

const Backend = (() => {
  const custom = () => window.ADARSH_BACKEND;
  const impl = () => custom() || (connUrl() ? HttpBackend : DemoBackend);
  return {
    isDemo: () => !custom() && !connUrl(),
    isNative: () => !!(custom() && custom().native),
    /* natural voice from the engine; null when this backend has none (demo, custom without tts) */
    canTts() { const b = impl(); return !!(b && b.tts); },
    tts(req, ms) { const b = impl(); return b && b.tts ? b.tts(req, ms) : Promise.resolve(null); },
    send(req, o) { req.abilities = enabledAbilities(); req.lang = S.settings.lang; return impl().send(req, o); },
    async lessons(op) { const b = impl(); return b.lessons ? b.lessons(op) : { ok: false, error: 'Demo mode me lessons nahi hote.' }; },
    missionAction(id, a) { const b = impl(); return b.missionAction ? b.missionAction(id, a) : Promise.resolve(null); },
    suggestions() { const b = impl(); return b.suggestions ? b.suggestions() : []; },
    async ping() { const b = impl(); return b.ping ? b.ping() : { ok: true, label: 'Custom backend' }; },
    async refresh() {
      if (this.isDemo()) return Bus.emit('backend:status', { label: 'Demo mode', demo: true });
      const tok = (this._tok = (this._tok || 0) + 1);  /* a newer refresh() cancels this loop */
      Bus.emit('backend:status', { label: 'Connecting…' });
      let r = await this.ping();
      /* the on-device engine boots in the background: keep asking for up to ~2 minutes instead of giving up */
      for (let i = 0; r && r.starting && i < 80 && tok === this._tok; i++) {
        Bus.emit('backend:status', { label: 'Starting…' });
        await new Promise(ok => setTimeout(ok, 1500));
        r = await this.ping();
      }
      if (tok !== this._tok) return;
      const label = r.ok ? 'Connected' : r.starting ? 'Offline' : (r.label && r.label !== 'Engine not reachable' ? r.label : 'Offline');
      Bus.emit('backend:status', { label, ok: r.ok, hint: r.hint || r.error || '' });
    },
    /* a reply that came back from the engine proves it is up, whatever the last ping said */
    markUp() { Bus.emit('backend:status', { label: 'Connected', ok: true }); }
  };
})();

'use strict';
/* 08-boot.js : start-up + the public hook object your backend can use to push things into the UI */
(function boot() {
  load();
  App.applyTheme();
  App.buildDrawer();
  Chat.mount($('#v-chat'));
  App.drawerList();

  /* Public surface for the architecture you add later:
       ADARSH_UI.push(reply[, {chatId}])  deliver an AI message (proactive alert, finished mission, question) into a chat
       ADARSH_UI.banner({title,text,onOpen}) top banner;  ADARSH_UI.toast(msg);  ADARSH_UI.send(text) type as the user */
  window.ADARSH_UI = {
    push: (r, o) => Chat.push(r, o), banner, toast, send: (t) => App.ask(t), open: (v) => App.show(v),
    on: Bus.on, version: 3
  };

  Backend.refresh();
  /* coming back to the app: the engine may have started (or been killed) meanwhile */
  document.addEventListener('visibilitychange', () => { if (!document.hidden) Backend.refresh(); });

  if (window.__adarshDictation) STT.dict = window.__adarshDictation;  // Android app: native SpeechRecognizer
  /* platform dictation (Chromium tabs / desktop app); Web Speech is the fallback inside STT */
  try { if (window.claude && claude.use) claude.use('dictation').then(d => { STT.dict = d || STT.dict || null; }).catch(() => {}); } catch (e) {}

  if (S.lock) Lock.lockNow();
})();
